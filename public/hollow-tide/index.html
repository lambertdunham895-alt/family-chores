<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hollow Tide</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#04101f;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#dbeafe;
  user-select:none;-webkit-user-select:none}
#stage{position:absolute;top:0;left:0;width:100%;height:100%;transform-origin:0 0}
#cv{position:absolute;inset:0;display:block;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;
  padding:8px 12px;background:linear-gradient(180deg,rgba(4,16,31,.92),rgba(4,16,31,0));
  pointer-events:none;font-size:13.5}
.stat{display:flex;align-items:center;gap:5px;background:rgba(6,22,40,.82);
  border:1px solid rgba(127,233,255,.25);border-radius:8px;padding:6px 10px;font-weight:700}
#gold{color:#fcd34d}#lives{color:#7fe9ff}#wave{color:#c4b5fd}
.sp{flex:1}
#hud button{pointer-events:auto}
#startBtn{background:#0e7490;color:#e0f2fe;border:1px solid #22d3ee;border-radius:8px;
  padding:8px 16px;font-weight:800;font-size:14px;cursor:pointer}
#spdBtn{background:rgba(6,22,40,.9);color:#7fe9ff;border:1px solid rgba(127,233,255,.32);
  border-radius:8px;padding:8px 12px;font-weight:800;cursor:pointer;min-width:44px}

#panel{position:absolute;left:8px;right:8px;bottom:8px;display:none;
  background:rgba(4,14,26,.96);border:1.5px solid rgba(127,233,255,.32);
  border-radius:14px;padding:10px 12px 12px}
.ph{font-weight:800;font-size:15px;margin-bottom:2px}
.ph .tier{color:#fcd34d;font-size:12px}
.ps{font-size:11.5px;color:#94a3b8;line-height:1.35;margin-bottom:8px}
.ps.nxt{color:#5eead4}
.blist{display:flex;gap:7px;margin-bottom:9px}
.bopt{flex:1;text-align:left;background:rgba(255,255,255,.05);
  border:1px solid rgba(127,233,255,.22);border-radius:10px;
  padding:9px 8px;cursor:pointer;color:#dbeafe;min-width:0}
.bopt.off{opacity:.38}
.bn{display:block;font-weight:700;font-size:12.5px;line-height:1.2}
.bc{display:block;font-weight:800;font-size:13px;color:#fcd34d;margin-top:3px}
.bd{display:block;font-size:10px;color:#8ea3b8;line-height:1.3;margin-top:4px}
.prow{display:flex;gap:8px}
.prow button{flex:1;border-radius:9px;padding:11px 0;font-weight:800;font-size:13px;
  cursor:pointer;background:#0e7490;color:#e0f2fe;border:1px solid #22d3ee}
.prow button:disabled{opacity:.4;cursor:default}
.prow .sell{background:rgba(30,41,59,.9);border-color:#475569;color:#cbd5e1}
.prow .max{background:rgba(30,41,59,.7);border-color:#475569;color:#94a3b8}
.pclose,.pclose2{background:transparent;border:1px solid rgba(255,255,255,.18);
  color:#8ea3b8;border-radius:9px;padding:11px 18px;font-weight:700;font-size:12.5px;cursor:pointer}
.pclose{width:100%;margin-top:2px}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:52px;
  font-size:12px;color:rgba(200,225,245,.85);pointer-events:none;
  background:rgba(4,14,26,.7);border:1px solid rgba(127,233,255,.2);
  border-radius:999px;padding:6px 16px}
#over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;background:rgba(4,12,24,.92);text-align:center;padding:24px}
#ovT{font-size:30px;font-weight:900;letter-spacing:.5px}
#ovS{font-size:14px;color:#94a3b8;max-width:340px;line-height:1.5}
#againBtn{margin-top:6px;background:#0e7490;color:#e0f2fe;border:1px solid #22d3ee;
  border-radius:10px;padding:12px 28px;font-weight:800;font-size:15px;cursor:pointer}

#rotate{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;background:#04101f;z-index:20;text-align:center;padding:30px}
#rotate .rt{font-size:19px;font-weight:800;color:#e0f2fe}
#rotate .rs{font-size:13.5px;color:#8ea3b8;max-width:280px;line-height:1.5}
#anywayBtn{background:transparent;border:1px solid rgba(127,233,255,.35);color:#7fe9ff;
  border-radius:999px;padding:10px 22px;font-weight:700;font-size:13px;cursor:pointer}
.phone{width:52px;height:88px;border:3px solid #7fe9ff;border-radius:10px;
  animation:tip 1.8s ease-in-out infinite}
@keyframes tip{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
</style>
</head>
<body>
<div id="stage">
<canvas id="cv"></canvas>

<div id="hud">
  <div class="stat"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fcd34d" stroke-width="2"><circle cx="12" cy="12" r="8"/></svg><span id="gold">0</span></div>
  <div class="stat"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7fe9ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg><span id="lives">0</span></div>
  <div class="stat"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"><path d="M2 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/></svg><span id="wave">0/25</span></div>
  <div class="sp"></div>
  <button id="spdBtn">1×</button>
  <button id="startBtn">Start</button>
</div>
<div id="hint">Tap a glowing pad to build</div>

<div id="panel"></div>

<div id="over">
  <div id="ovT">The City Falls</div>
  <div id="ovS"></div>
  <button id="againBtn">Dive Again</button>
</div>

</div>

<div id="rotate">
  <div class="phone"></div>
  <div class="rt">Turn your phone sideways</div>
  <div class="rs">Hollow Tide plays in landscape. Turn the phone and it will fill the screen.</div>
  <button id="anywayBtn">Play in portrait anyway</button>
</div>

/* The 12 turret pads, taken from the glowing rings on the map. */
const PADS=[[143, 537], [276, 382], [443, 296], [503, 564], [621, 257], [667, 773], [757, 615], [920, 741], [1052, 227], [1089, 515], [1297, 308], [1302, 500], [1312, 693], [1523, 495]];

function pathLen(p){let L=0;for(let i=1;i<p.length;i++)L+=dist(p[i-1][0],p[i-1][1],p[i][0],p[i][1]);return L;}
const PATH_LEN=pathLen(PATH);
function pathAt(d){
  let rem=d;
  for(let i=1;i<PATH.length;i++){
    const[ax,ay]=PATH[i-1],[bx,by]=PATH[i],seg=dist(ax,ay,bx,by);
    if(rem<=seg){const t=seg?rem/seg:0;return{x:lerp(ax,bx,t),y:lerp(ay,by,t),a:Math.atan2(by-ay,bx-ax)};}
    rem-=seg;
  }
  const[ax,ay]=PATH[PATH.length-2],[bx,by]=PATH[PATH.length-1];
  return{x:bx,y:by,a:Math.atan2(by-ay,bx-ax)};
}
function distToPath(px,py){
  let best=1e9;
  for(let i=1;i<PATH.length;i++){
    const[ax,ay]=PATH[i-1],[bx,by]=PATH[i];
    const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;
    let t=L2?((px-ax)*dx+(py-ay)*dy)/L2:0; t=clamp(t,0,1);
    best=Math.min(best,dist(px,py,ax+dx*t,ay+dy*t));
  }
  return best;
}

/* Sizes track the width of the painted road so the horde reads as a column. */

/* Boss HP is absolute — it deliberately does NOT use the per-wave scaling that
   trash enemies get. These numbers were measured against what a realistic build
   can actually deliver by the wave each boss appears on, with roughly a 25%
   margin so a good board wins and a thin one does not. Armour is lighter than
   before so chain and splash builds are not simply locked out. */
const BOSSES={
  crabking: {name:"Crab King",  hp:1650,  speed:45, bounty:180, sprite:"b_crabking",  size:96,  armor:.34},
  matriarch:{name:"Matriarch",  hp:4400,  speed:57, bounty:230, sprite:"b_matriarch", size:99,  slowImmune:true},

  squid:    {name:"Colossus",   hp:6600,  speed:51, bounty:420, sprite:"b_squid",     size:114, armor:.25},
};

function buildWaves(){
  const W=[];
  const g=(t,n,s,e)=>({t,n,s:s*0.88,e:!!e});
  W.push({groups:[g("larva",8,.85)]});
  W.push({groups:[g("larva",12,.7)]});
  W.push({groups:[g("larva",8,.6),g("crab",3,1.4)]});
  W.push({groups:[g("crab",7,1.0)]});
  W.push({groups:[g("jelly",8,.8)],boss:null});
  W.push({groups:[g("larva",14,.45),g("jelly",5,.9)]});
  W.push({groups:[g("crab",8,.85),g("angler",2,2.0)]});
  W.push({groups:[g("jelly",10,.6),g("larva",10,.4,true)]});
  W.push({groups:[g("angler",5,1.5),g("crab",6,.8,true)]});
  W.push({groups:[g("larva",12,.4,true)],boss:"crabking"});
  W.push({groups:[g("jelly",12,.55,true),g("crab",6,.9)]});
  W.push({groups:[g("angler",6,1.2),g("larva",16,.35,true)]});
  W.push({groups:[g("crab",12,.6,true),g("jelly",8,.7)]});
  W.push({groups:[g("angler",8,1.0,true)]});
  W.push({groups:[g("jelly",14,.5,true),g("larva",18,.3,true)],boss:"matriarch"});
  W.push({groups:[g("crab",14,.55,true),g("angler",5,1.3,true)]});
  W.push({groups:[g("larva",24,.28,true),g("jelly",12,.5,true)]});
  W.push({groups:[g("angler",10,.9,true),g("crab",10,.6,true)]});
  W.push({groups:[g("jelly",16,.45,true),g("angler",8,1.0,true)]});
  W.push({groups:[g("crab",10,.6,true)],boss:"ancient"});
  W.push({groups:[g("larva",30,.25,true),g("crab",12,.5,true)]});
  W.push({groups:[g("angler",12,.8,true),g("jelly",16,.4,true)]});
  W.push({groups:[g("crab",18,.45,true),g("angler",10,.9,true)]});
  W.push({groups:[g("jelly",20,.35,true),g("larva",30,.22,true)]});
  W.push({groups:[g("angler",10,.8,true),g("crab",12,.5,true)],boss:"squid"});
  return W;
}

/* ===== entities, simulation, rendering ===== */
let CV,CTX,DPR=1,SC=1,OX=0,OY=0;
const IMG={};

/* The app is installed portrait-locked, so when the phone is held sideways the
   OS does not rotate anything. We rotate the whole stage ourselves instead, which
   means the game fills the screen either way and needs no reinstall. */
let ROT=false, S_forcePortrait=false;

function fit(){
  const vw=window.innerWidth, vh=window.innerHeight;
  ROT = (vh > vw*1.05) && !S_forcePortrait;
  const stage=document.getElementById("stage");
  // when rotated the stage is laid out landscape, then turned 90 degrees
  const w = ROT? vh : vw;
  const h = ROT? vw : vh;
  if(stage){
    stage.style.width=w+"px";
    stage.style.height=h+"px";
    stage.style.transform = ROT ? `rotate(90deg) translateY(-${h}px)` : "none";
  }
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  CV.width=Math.round(w*DPR); CV.height=Math.round(h*DPR);
  CV.style.width=w+"px"; CV.style.height=h+"px";
  SC=Math.min(w/VW,h/VH); OX=(w-VW*SC)/2; OY=(h-VH*SC)/2;
}

function toWorld(cx,cy){
  // undo the stage rotation before undoing the letterbox fit
  let sx,sy;
  if(ROT){ sx = cy;                       sy = window.innerWidth - cx; }
  else   { sx = cx;                       sy = cy; }
  return {x:(sx-OX)/SC, y:(sy-OY)/SC};
}

/* ---- state ---- */
let S=null;
function newGame(){
  S={towers:[],enemies:[],shots:[],fx:[],float:[],
     gold:220,lives:20,wave:0,waveActive:false,queue:[],spawnT:0,
     over:false,won:false,speed:1,t:0,
     selPad:null,                       /* index into PADS, or null */
     shake:0,waves:buildWaves(),leaked:0,killed:0};
}

/* ---- enemies ---- */
const LANE = PATH_W*0.42;          // how far off centre a creature may drift

function spawn(type,elite,isBoss){
  const B=isBoss?BOSSES[type]:ENEMIES[type];
  const m=isBoss?1:(elite?1.75:1);
  // bosses carry their own absolute HP; only trash scales with the wave number
  const hp=isBoss ? B.hp : Math.round(B.hp*m*(1+S.wave*0.135));
  // Bosses hold the centre line; everything else spreads across the lane and
  // varies its pace, which is what turns a queue into a crowd.
  const off  = isBoss ? 0 : (Math.random()*2-1)*LANE;
  const jit  = isBoss ? 1 : 0.88+Math.random()*0.24;
  S.enemies.push({
    type,boss:!!isBoss,elite:!!elite,hp,max:hp,
    d:isBoss?0:-Math.random()*26,        // stagger the start so groups don't align
    speed:B.speed*(isBoss?1:(elite?1.06:1))*jit,
    bounty:Math.round(B.bounty*(elite?1.5:1)),
    armor:B.armor||0, slowImmune:!!B.slowImmune, stun:!!B.stun,
    size:B.size*(elite?1.18:1), sprite:isBoss?B.sprite:B.sprite+(elite?"_e":"_n"),
    off, offT:off,                        // current and target lateral offset
    wob:Math.random()*TAU, wobA:isBoss?0:0.6+Math.random()*1.5,
    slow:0, slowT:0, hitT:0, x:0,y:0,a:0, dead:false});
}

function startWave(){
  if(S.waveActive||S.over) return;
  S.wave++;
  const W=S.waves[S.wave-1]; if(!W) return;
  S.queue=[]; let t=0;
  W.groups.forEach(g=>{
    for(let i=0;i<g.n;i++){
      // jitter each spawn so arrivals clump instead of ticking like a metronome
      S.queue.push({t:t+Math.random()*g.s*0.8,type:g.t,elite:g.e,boss:false});
      t+=g.s;
    }
    t+=1.0;
  });
  if(W.boss) S.queue.push({t:t+1.5,type:W.boss,elite:false,boss:true});
  S.queue.sort((a,b)=>a.t-b.t);
  S.spawnT=0; S.waveActive=true;
}

/* ---- towers ---- */
/* Generous tap radius: on a phone this scales down to ~48 css px, which is
   about a fingertip. At the old 52 it was 23px and almost unhittable. */
const PAD_R=112;
function padAt(x,y){
  let best=-1,bd=PAD_R;
  for(let i=0;i<PADS.length;i++){
    const d=dist(PADS[i][0],PADS[i][1],x,y);
    if(d<bd){bd=d;best=i;}
  }
  return best<0?null:best;
}
function towerOnPad(i){return S.towers.find(t=>t.pad===i)||null;}
function place(kind,pad){
  const T=TOWERS[kind];
  if(pad==null||S.gold<T.cost||towerOnPad(pad)) return false;
  S.gold-=T.cost;
  S.towers.push({kind,pad,x:PADS[pad][0],y:PADS[pad][1],
    tier:0,cd:0,angle:-Math.PI/2,pulse:1,kills:0});
  ring(PADS[pad][0],PADS[pad][1],90,"#67e8f9");
  return true;
}
function upgrade(t){
  const T=TOWERS[t.kind]; if(t.tier>=2) return;
  const c=T.up[t.tier]; if(S.gold<c) return;
  S.gold-=c; t.tier++; t.pulse=1;
}
function sell(t){
  const T=TOWERS[t.kind];
  let paid=T.cost; for(let i=0;i<t.tier;i++) paid+=T.up[i];
  S.gold+=Math.floor(paid*0.6);
  S.towers=S.towers.filter(x=>x!==t);
}

function damage(e,amt,pierce){
  const eff=amt*(1-(e.armor||0)*(1-(pierce||0)));
  e.hp-=eff; e.hitT=.12;
  if(e.hp<=0&&!e.dead){
    e.dead=true; S.gold+=e.bounty; S.killed++;
    S.float.push({x:e.x,y:e.y,txt:"+"+e.bounty,t:1,c:"#ffd98a"});
    burst(e.x,e.y,e.boss?46:e.elite?20:12,e.boss?4:2);
    if(e.boss){S.shake=18;}
  }
}

/* ---- fx ---- */
function burst(x,y,n,sz){
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,s=40+Math.random()*180;
    S.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:.5+Math.random()*.5,
      r:(1+Math.random()*2)*(sz||1),c:Math.random()<.5?"#67e8f9":"#a78bfa"});
  }
}
function ring(x,y,r,c){S.fx.push({ring:true,x,y,r0:8,r1:r,t:.42,life:.42,c:c||"#38bdf8"});}

/* ===== simulation step ===== */
function update(dt){
  if(S.over) return;
  S.t+=dt;
  if(S.shake>0) S.shake=Math.max(0,S.shake-dt*40);

  /* spawn queue */
  if(S.waveActive){
    S.spawnT+=dt;
    while(S.queue.length&&S.queue[0].t<=S.spawnT){
      const q=S.queue.shift(); spawn(q.type,q.elite,q.boss);
    }
    if(!S.queue.length&&!S.enemies.length){
      S.waveActive=false;
      S.gold+=24+S.wave*6;
      S.float.push({x:VW/2,y:120,txt:"Wave "+S.wave+" cleared  +"+(24+S.wave*6),t:1.8,c:"#7dd3fc",big:true});
      if(S.wave>=S.waves.length){S.over=true;S.won=true;}
    }
  }

  /* enemies */
  for(const e of S.enemies){
    if(e.hitT>0) e.hitT-=dt;
    if(e.slowT>0){e.slowT-=dt; if(e.slowT<=0) e.slow=0;}
    const sp=e.speed*(1-(e.slowImmune?0:e.slow));
    e.d+=sp*dt;

    // sit on the path, then step sideways by this creature's own offset plus a
    // slow wander, so the column reads as a crowd rather than a queue
    const p=pathAt(Math.max(0,e.d));
    e.wob+=dt*0.9;
    const drift=Math.sin(e.wob)*e.wobA;
    e.off += (e.offT-e.off)*Math.min(1,dt*2.2);
    const lat=e.off+drift;
    e.x=p.x-Math.sin(p.a)*lat;
    e.y=p.y+Math.cos(p.a)*lat;
    e.a=p.a;
    if(e.d>=PATH_LEN){
      e.dead=true; e.leak=true;
      S.lives-=e.boss?5:1; S.leaked++; S.shake=Math.max(S.shake,10);
      if(S.lives<=0){S.lives=0;S.over=true;S.won=false;}
    }
  }
  S.enemies=S.enemies.filter(e=>!e.dead);

  /* Soft separation: crowds should jostle, not overlap into one blob.
     Resolved in path-space (along/across) so nobody gets shoved off the track. */
  const N=S.enemies.length;
  for(let i=0;i<N;i++){
    const a=S.enemies[i]; if(a.boss) continue;
    for(let j=i+1;j<N;j++){
      const b=S.enemies[j];
      const dd=a.d-b.d;
      if(dd>46||dd<-46) continue;                 // only near neighbours
      const need=(a.size+b.size)*0.34;
      const dx=a.x-b.x, dy=a.y-b.y;
      const d2=dx*dx+dy*dy;
      if(d2>=need*need||d2<0.01) continue;
      const push=(need-Math.sqrt(d2))*0.5;
      // spread them across the lane first; nudge along it only a little
      const s1=b.boss?1:0.5, s0=b.boss?0:0.5;
      a.offT=clamp(a.offT+push*0.9*(a.off>=b.off?1:-1),-LANE,LANE);
      if(!b.boss) b.offT=clamp(b.offT-push*0.9*(a.off>=b.off?1:-1),-LANE,LANE);
      a.d+=push*0.16*s1*(dd>=0?1:-1);
      if(!b.boss) b.d-=push*0.16*s0*(dd>=0?1:-1);
    }
  }

  /* towers */
  for(const t of S.towers){
    const T=TOWERS[t.kind], tier=T.tiers[t.tier];
    if(t.pulse>0) t.pulse=Math.max(0,t.pulse-dt*2);

    if(T.aura){                       /* current vent: continuous slow field */
      for(const e of S.enemies){
        if(e.slowImmune) continue;
        if(dist(t.x,t.y,e.x,e.y)<=tier.range){ e.slow=Math.max(e.slow,tier.slow); e.slowT=.35; }
      }
      t.cd-=dt; if(t.cd<=0){ t.cd=1.1; ring(t.x,t.y,tier.range,"#5eead4"); }
      continue;
    }

    t.cd-=dt; if(t.cd>0) continue;
    /* target the enemy furthest along the path within range */
    let best=null,bd=-1;
    for(const e of S.enemies){
      if(dist(t.x,t.y,e.x,e.y)<=tier.range && e.d>bd){best=e;bd=e.d;}
    }
    if(!best) continue;
    t.cd=1/tier.rate;
    t.angle=Math.atan2(best.y-t.y,best.x-t.x);

    if(T.splash){
      ring(t.x,t.y,tier.range,"#38bdf8");
      /* only the closest few take the pulse — otherwise one tower clears a whole wave */
      const inR=S.enemies.filter(e=>dist(t.x,t.y,e.x,e.y)<=tier.range)
        .sort((a,b)=>dist(t.x,t.y,a.x,a.y)-dist(t.x,t.y,b.x,b.y))
        .slice(0,tier.cap||6);
      for(const e of inR) damage(e,tier.dmg,0);
      t.pulse=.6;
    }else if(tier.chain){
      let cur=best,hit=[cur],dmg=tier.dmg;
      damage(cur,dmg,0);
      for(let c=1;c<tier.chain;c++){
        let nx=null,nd=1e9;
        for(const e of S.enemies){
          if(hit.includes(e)) continue;
          const d2=dist(cur.x,cur.y,e.x,e.y);
          if(d2<120&&d2<nd){nd=d2;nx=e;}
        }
        if(!nx) break;
        S.fx.push({bolt:true,x1:cur.x,y1:cur.y,x2:nx.x,y2:nx.y,t:.16,life:.16});
        dmg*=.85; damage(nx,dmg,0); hit.push(nx); cur=nx;
      }
      S.fx.push({bolt:true,x1:t.x,y1:t.y,x2:best.x,y2:best.y,t:.16,life:.16});
      t.pulse=.5;
    }else{
      S.shots.push({x:t.x,y:t.y,tx:best.x,ty:best.y,target:best,
        sp:520,dmg:tier.dmg,img:T.shot,a:t.angle,pierce:T.pierceArmor||0});
      t.pulse=.4;
    }
  }

  /* projectiles */
  for(const s of S.shots){
    if(s.target&&!s.target.dead){s.tx=s.target.x;s.ty=s.target.y;}
    const dx=s.tx-s.x,dy=s.ty-s.y,L=Math.hypot(dx,dy);
    if(L<12){ 
      if(s.target&&!s.target.dead) damage(s.target,s.dmg,s.pierce);
      burst(s.x,s.y,5,1); s.done=true; continue;
    }
    s.a=Math.atan2(dy,dx);
    s.x+=dx/L*s.sp*dt; s.y+=dy/L*s.sp*dt;
  }
  S.shots=S.shots.filter(s=>!s.done);

  /* particles */
  for(const f of S.fx){
    f.t-=dt;
    if(!f.ring&&!f.bolt){ f.x+=f.vx*dt; f.y+=f.vy*dt; f.vx*=.94; f.vy*=.94; }
  }
  S.fx=S.fx.filter(f=>f.t>0);
  for(const f of S.float){ f.t-=dt; f.y-=18*dt; }
  S.float=S.float.filter(f=>f.t>0);
}

/* ===== rendering ===== */
let motes=[];
function initBG(){
  motes=[];
  for(let i=0;i<60;i++) motes.push({x:Math.random()*VW,y:Math.random()*VH,
    r:.8+Math.random()*2.4,s:6+Math.random()*18,p:Math.random()*TAU});
}
function drawBG(){
  const im=IMG.map;
  if(im&&im.complete&&im.naturalWidth){
    CTX.drawImage(im,0,0,VW,VH);
  }else{
    CTX.fillStyle="#07162b"; CTX.fillRect(0,0,VW,VH);
  }
  /* drifting motes over the painting for a little life */
  CTX.save(); CTX.globalAlpha=.35;
  for(const m of motes){
    const y=(m.y+S.t*m.s)%VH;
    CTX.fillStyle="rgba(170,230,255,.55)";
    CTX.beginPath(); CTX.arc(m.x+Math.sin(S.t*.5+m.p)*8,y,m.r,0,TAU); CTX.fill();
  }
  CTX.restore();
}

function drawPath(){
  /* faint travelling dashes so the direction of travel is obvious */
  CTX.save();
  CTX.lineCap="round"; CTX.lineJoin="round";
  CTX.setLineDash([16,26]); CTX.lineDashOffset=-S.t*34;
  CTX.strokeStyle="rgba(150,240,255,.18)"; CTX.lineWidth=3;
  CTX.beginPath(); PATH.forEach((p,i)=>i?CTX.lineTo(p[0],p[1]):CTX.moveTo(p[0],p[1]));
  CTX.stroke(); CTX.restore();
}

function drawPads(){
  for(let i=0;i<PADS.length;i++){
    const [x,y]=PADS[i];
    const occupied=towerOnPad(i);
    if(occupied) continue;
    const pulse=0.5+0.5*Math.sin(S.t*2+i);
    CTX.save();
    CTX.globalAlpha=(S.selPad===i?0.85:0.30)+pulse*0.12;
    CTX.strokeStyle="#7fe9ff"; CTX.lineWidth=S.selPad===i?4:2.5;
    CTX.beginPath(); CTX.ellipse(x,y,44,40,0,0,TAU); CTX.stroke();
    if(S.selPad===i){
      CTX.globalAlpha=.16; CTX.fillStyle="#7fe9ff";
      CTX.beginPath(); CTX.ellipse(x,y,44,40,0,0,TAU); CTX.fill();
    }
    CTX.restore();
  }
  /* range preview for whichever pad is selected */
  if(S.selPad!=null){
    const t=towerOnPad(S.selPad);
    const r=t?TOWERS[t.kind].tiers[t.tier].range:null;
    if(r){
      const [x,y]=PADS[S.selPad];
      CTX.save(); CTX.globalAlpha=.13; CTX.fillStyle="#67e8f9";
      CTX.beginPath(); CTX.arc(x,y,r,0,TAU); CTX.fill();
      CTX.globalAlpha=.45; CTX.strokeStyle="#67e8f9"; CTX.lineWidth=2; CTX.stroke();
      CTX.restore();
    }
  }
}

function img(k){return IMG[k];}
function drawSprite(k,x,y,size,rot,alpha){
  const im=img(k); if(!im||!im.complete||!im.naturalWidth) return false;
  const s=size/Math.max(im.naturalWidth,im.naturalHeight);
  const w=im.naturalWidth*s,h=im.naturalHeight*s;
  CTX.save(); CTX.translate(x,y); if(rot) CTX.rotate(rot);
  if(alpha!=null) CTX.globalAlpha=alpha;
  CTX.drawImage(im,-w/2,-h/2,w,h); CTX.restore(); return true;
}
function drawEnemies(){
  for(const e of S.enemies){
    if(e.slow>0&&!e.slowImmune){
      CTX.save(); CTX.globalAlpha=.5; CTX.strokeStyle="#5eead4"; CTX.lineWidth=2;
      CTX.beginPath(); CTX.arc(e.x,e.y,e.size*.62,0,TAU); CTX.stroke(); CTX.restore();
    }
    const ok=drawSprite(e.sprite,e.x,e.y,e.size,e.a);
    if(!ok){ CTX.fillStyle=e.boss?"#a78bfa":"#67e8f9";
      CTX.beginPath(); CTX.arc(e.x,e.y,e.size*.4,0,TAU); CTX.fill(); }
    if(e.hitT>0){
      CTX.save(); CTX.globalAlpha=clamp(e.hitT*5,0,.8); CTX.fillStyle="#fff";
      CTX.beginPath(); CTX.arc(e.x,e.y,e.size*.45,0,TAU); CTX.fill(); CTX.restore();
    }
    /* hp bar */
    if(e.hp<e.max){
      const w=e.size*.86,h=e.boss?6:4,x=e.x-w/2,y=e.y-e.size*.62;
      CTX.fillStyle="rgba(0,0,0,.6)"; CTX.fillRect(x-1,y-1,w+2,h+2);
      const f=clamp(e.hp/e.max,0,1);
      CTX.fillStyle=f>.5?"#4ade80":f>.22?"#fbbf24":"#f87171";
      CTX.fillRect(x,y,w*f,h);
    }
    if(e.boss){
      CTX.fillStyle="rgba(196,181,253,.9)"; CTX.font="bold 12px system-ui";
      CTX.textAlign="center"; CTX.fillText(BOSSES[e.type].name,e.x,e.y-e.size*.68);
    }
  }
}
function drawTowers(){
  for(const t of S.towers){
    const T=TOWERS[t.kind],tier=T.tiers[t.tier];
    if(S.selPad===t.pad){
      CTX.save(); CTX.globalAlpha=.16; CTX.fillStyle="#67e8f9";
      CTX.beginPath(); CTX.arc(t.x,t.y,tier.range,0,TAU); CTX.fill();
      CTX.globalAlpha=.5; CTX.strokeStyle="#67e8f9"; CTX.lineWidth=1.5; CTX.stroke(); CTX.restore();
    }
    if(t.pulse>0){
      CTX.save(); CTX.globalAlpha=t.pulse*.4; CTX.fillStyle="#7dd3fc";
      CTX.beginPath(); CTX.arc(t.x,t.y,34+t.pulse*10,0,TAU); CTX.fill(); CTX.restore();
    }
    const rot=T.aura||T.splash?0:t.angle+Math.PI/2;
    const ok=drawSprite(`t_${t.kind}_${t.tier+1}`,t.x,t.y,74+t.tier*9,rot);
    if(!ok){CTX.fillStyle="#2dd4bf";CTX.beginPath();CTX.arc(t.x,t.y,20,0,TAU);CTX.fill();}
    if(t.tier>0){
      CTX.fillStyle="#fcd34d"; CTX.font="bold 11px system-ui"; CTX.textAlign="center";
      CTX.fillText("★".repeat(t.tier),t.x,t.y+34+t.tier*3);
    }
  }
}
function drawShots(){
  for(const s of S.shots){
    if(!drawSprite(s.img,s.x,s.y,34,s.a)){
      CTX.fillStyle="#67e8f9"; CTX.beginPath(); CTX.arc(s.x,s.y,4,0,TAU); CTX.fill();
    }
  }
}
function drawFX(){
  for(const f of S.fx){
    if(f.ring){
      const k=1-f.t/f.life;
      CTX.save(); CTX.globalAlpha=(1-k)*.6; CTX.strokeStyle=f.c; CTX.lineWidth=3;
      CTX.beginPath(); CTX.arc(f.x,f.y,lerp(f.r0,f.r1,k),0,TAU); CTX.stroke(); CTX.restore();
    }else if(f.bolt){
      CTX.save(); CTX.globalAlpha=f.t/f.life; CTX.strokeStyle="#a3e635"; CTX.lineWidth=2.5;
      CTX.shadowColor="#a3e635"; CTX.shadowBlur=10;
      CTX.beginPath(); CTX.moveTo(f.x1,f.y1);
      const seg=4;
      for(let i=1;i<seg;i++){
        const t2=i/seg;
        CTX.lineTo(lerp(f.x1,f.x2,t2)+(Math.random()-.5)*14,lerp(f.y1,f.y2,t2)+(Math.random()-.5)*14);
      }
      CTX.lineTo(f.x2,f.y2); CTX.stroke(); CTX.restore();
    }else{
      CTX.save(); CTX.globalAlpha=clamp(f.t*2,0,1); CTX.fillStyle=f.c;
      CTX.beginPath(); CTX.arc(f.x,f.y,f.r,0,TAU); CTX.fill(); CTX.restore();
    }
  }
  for(const f of S.float){
    CTX.save(); CTX.globalAlpha=clamp(f.t,0,1); CTX.fillStyle=f.c;
    CTX.font=(f.big?"bold 26px":"bold 15px")+" system-ui"; CTX.textAlign="center";
    CTX.fillText(f.txt,f.x,f.y); CTX.restore();
  }
}
function render(){
  CTX.setTransform(DPR,0,0,DPR,0,0);
  CTX.clearRect(0,0,CV.width,CV.height);
  CTX.fillStyle="#02060f"; CTX.fillRect(0,0,CV.width,CV.height);
  const sx=S.shake?(Math.random()-.5)*S.shake:0, sy=S.shake?(Math.random()-.5)*S.shake:0;
  CTX.save(); CTX.translate(OX+sx,OY+sy); CTX.scale(SC,SC);
  CTX.beginPath(); CTX.rect(0,0,VW,VH); CTX.clip();
  drawBG(); drawPath(); drawPads(); drawTowers(); drawEnemies(); drawShots(); drawFX();
  CTX.restore();
}

/* ===== input + DOM UI ===== */
const $=id=>document.getElementById(id);
const money=n=>"◈"+n;

function syncHUD(){
  $("gold").textContent=money(S.gold);
  $("lives").textContent=S.lives;
  $("wave").textContent=S.wave+"/"+S.waves.length;
  $("startBtn").style.display=(S.waveActive||S.over)?"none":"block";
  $("startBtn").textContent=S.wave===0?"Start":"Wave "+(S.wave+1);
  $("spdBtn").textContent=S.speed+"×";

  const p=$("panel");
  if(S.selPad==null){ p.style.display="none"; return; }
  const t=towerOnPad(S.selPad);
  p.style.display="block";

  if(!t){
    /* empty pad -> build menu */
    p.innerHTML=`<div class="ph">Build here</div><div class="blist">`+
      TORDER.map(k=>{
        const T=TOWERS[k], afford=S.gold>=T.cost;
        return `<button class="bopt${afford?"":" off"}" data-k="${k}">
          <span class="bn">${T.name}</span>
          <span class="bc">${money(T.cost)}</span>
        </button>`;
      }).join("")+`</div>
      <button class="pclose" id="closeB">Cancel</button>`;
    p.querySelectorAll(".bopt").forEach(b=>{
      b.onclick=()=>{
        const k=b.dataset.k;
        if(S.gold<TOWERS[k].cost){
          S.float.push({x:VW/2,y:VH/2,txt:"Not enough pearls",t:1.3,c:"#f87171",big:true});
          return;
        }
        if(place(k,S.selPad)) S.selPad=null;
        syncHUD();
      };
    });
    $("closeB").onclick=()=>{S.selPad=null;syncHUD();};
  }else{
    /* occupied pad -> upgrade / sell */
    const T=TOWERS[t.kind], cur=T.tiers[t.tier], nxt=T.tiers[t.tier+1];
    let paid=T.cost; for(let i=0;i<t.tier;i++) paid+=T.up[i];
    p.innerHTML=`<div class="ph">${T.name} <span class="tier">${"★".repeat(t.tier)||"Tier 1"}</span></div>
      <div class="ps">${T.aura?`Slow ${Math.round(cur.slow*100)}%`:`Damage ${cur.dmg}`} · Range ${Math.round(cur.range)}${T.aura?"":` · ${cur.rate.toFixed(2)}/s`}</div>
      ${nxt?`<div class="ps nxt">Next: ${T.aura?`Slow ${Math.round(nxt.slow*100)}%`:`Damage ${nxt.dmg}`} · Range ${Math.round(nxt.range)}</div>`:""}
      <div class="prow">
        ${nxt?`<button id="upB">Upgrade ${money(T.up[t.tier])}</button>`
             :`<button class="max" disabled>Max tier</button>`}
        <button id="slB" class="sell">Sell ${money(Math.floor(paid*.6))}</button>
        <button id="closeB" class="pclose2">Close</button>
      </div>`;
    if(nxt){const b=$("upB"); b.disabled=S.gold<T.up[t.tier]; b.onclick=()=>{upgrade(t);syncHUD();};}
    $("slB").onclick=()=>{sell(t);S.selPad=null;syncHUD();};
    $("closeB").onclick=()=>{S.selPad=null;syncHUD();};
  }
}

function tap(cx,cy){
  const w=toWorld(cx,cy);
  const i=padAt(w.x,w.y);
  S.selPad=(i!=null&&i!==S.selPad)?i:null;
  syncHUD();
}

function checkOrientation(){
  // With the stage rotation in place the game always fits, so the gate only
  // shows if the player explicitly chose portrait and the screen is very tall.
  $("rotate").style.display="none";
}

function bindInput(){
  CV.addEventListener("pointerdown",e=>{e.preventDefault();tap(e.clientX,e.clientY);});
  $("startBtn").onclick=()=>{startWave();syncHUD();};
  $("spdBtn").onclick=()=>{S.speed=S.speed===1?2:S.speed===2?3:1;syncHUD();};
  $("againBtn").onclick=()=>{newGame();$("over").style.display="none";syncHUD();};
  const aw=$("anywayBtn");
  if(aw) aw.onclick=()=>{S_forcePortrait=true;fit();checkOrientation();syncHUD();};
  window.addEventListener("resize",()=>{fit();checkOrientation();});
  window.addEventListener("orientationchange",()=>setTimeout(()=>{fit();checkOrientation();},220));
  window.addEventListener("keydown",e=>{
    if(e.key==="Escape"){S.selPad=null;syncHUD();}
    if(e.key===" "){e.preventDefault();startWave();syncHUD();}
  });
}

let last=0;
function loop(ts){
  const dt=Math.min((ts-last)/1000||0,.05); last=ts;
  for(let i=0;i<S.speed;i++) update(dt);
  render();
  if(S.over&&$("over").style.display!=="flex"){
    $("over").style.display="flex";
    $("ovT").textContent=S.won?"The Trench Holds":"The City Falls";
    $("ovS").textContent=S.won
      ? `All ${S.waves.length} waves cleared. ${S.killed} kills, ${S.lives} lives left.`
      : `Wave ${S.wave} of ${S.waves.length}. ${S.killed} kills.`;
  }
  syncHUD();
  requestAnimationFrame(loop);
}

function boot(){
  CV=$("cv"); CTX=CV.getContext("2d");
  Object.keys(sprite_data).forEach(k=>{const i=new Image();i.src=sprite_data[k];IMG[k]=i;});
  newGame(); initBG(); fit(); checkOrientation(); bindInput(); syncHUD();
  requestAnimationFrame(loop);
}

boot();
</script>
