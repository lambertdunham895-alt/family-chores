<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>N7 Pinball</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{height:100%;background:#05060a;overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#0b1020,#05060a 70%)}
  canvas{display:block;height:100%;width:auto;touch-action:none;image-rendering:auto}
  #hint{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);color:#3b4a6b;font-size:11px;letter-spacing:1px;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="560" height="980"></canvas></div>
<div id="hint">SIDES = flippers &nbsp;·&nbsp; HOLD = launch &nbsp;·&nbsp; Z / C = nudge</div>
<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);
const W=560,H=980,b=14,laneX=496;
cv.width=W*DPR; cv.height=H*DPR;

// ---------- geometry ----------
const walls=[];
const seg=(x1,y1,x2,y2,k)=>walls.push({x1,y1,x2,y2,k:k||1});
(function(){
  const ytop=34,ybase=170,N=16;
  let prev=null;
  for(let i=0;i<=N;i++){const x=b+(W-2*b)*i/N, y=ybase-(ybase-ytop)*Math.sin(Math.PI*i/N);
    if(prev)seg(prev[0],prev[1],x,y); prev=[x,y];}
})();
seg(b,170,b,690);  seg(b,690,150,852,1.05);
seg(laneX,210,laneX,690);  seg(laneX,690,410,852,1.05);
seg(W-b,170,W-b,H-24);  seg(laneX,H-24,W-b,H-24);
const bumpers=[
  {x:W*0.50, y:262, r:48, art:'bumper3'},  // back/top center (was the front one)
  {x:W*0.34, y:372, r:46, art:'bumper1'},  // mid-left
  {x:W*0.66, y:372, r:46, art:'bumper2'},  // mid-right
  {x:W*0.19, y:648, r:30, art:'bumper1'},  // small jet, lower-left
  {x:W*0.81, y:648, r:30, art:'bumper2'},  // small jet, lower-right
];
bumpers.forEach(bp=>{bp.flash=0;});
const LP={x:150,y:852}, RP={x:410,y:852}, FLEN=112, REST=0.30, SWING=0.62, FTHICK=8;
const serve={x:521,y:H-70};

// ---------- assets ----------
const FILES={ball:'ball.png',bumper1:'bumper1.png',bumper2:'bumper2.png',bumper3:'bumper3.png',table:'table.jpg'};
const IMG={}; let loaded=0; const KEYS=Object.keys(FILES); const loadStart=Date.now();
KEYS.forEach(k=>{const im=new Image(); im.onload=()=>{loaded++;}; im.onerror=()=>{loaded++;}; im.src='assets/'+FILES[k]; IMG[k]=im;});
function ready(){ return loaded>=KEYS.length || (Date.now()-loadStart)>6000; }

// ---------- audio ----------
let AC=null;
function initAudio(){ if(AC)return; try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
function blip(freq,dur,type,vol){ if(!AC)return; const t=AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(freq,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*0.6),t+dur);
  g.gain.setValueAtTime(vol||0.18,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);}
const SFX={
  bump:()=>{blip(520,0.12,'triangle',0.22); blip(780,0.08,'sine',0.12);},
  flip:()=>blip(190,0.06,'square',0.10),
  launch:()=>blip(160,0.4,'sawtooth',0.18),
  drain:()=>{blip(200,0.5,'sawtooth',0.2); setTimeout(()=>blip(120,0.6,'sine',0.18),120);},
  wall:()=>blip(330,0.05,'sine',0.06),
  over:()=>{[440,330,247,165].forEach((f,i)=>setTimeout(()=>blip(f,0.5,'triangle',0.2),i*200));},
  start:()=>{[330,440,550,660].forEach((f,i)=>setTimeout(()=>blip(f,0.3,'sine',0.18),i*90));},
  target:()=>{blip(880,0.09,'square',0.16); blip(1320,0.06,'sine',0.10);},
  bank:()=>{[660,880,1100].forEach((f,i)=>setTimeout(()=>blip(f,0.18,'triangle',0.2),i*70));},
  mission:()=>{[220,330,440,550,660,880].forEach((f,i)=>setTimeout(()=>blip(f,0.28,'sawtooth',0.16),i*80));},
  jackpot:()=>{[880,1100,1320,1760].forEach((f,i)=>setTimeout(()=>blip(f,0.35,'square',0.2),i*90));},
  multiball:()=>{[165,220,330,440,550,660,880,1100].forEach((f,i)=>setTimeout(()=>blip(f,0.25,'triangle',0.2),i*70));},
  combo:(n)=>blip(440+n*90,0.09,'square',0.16),
  kickback:()=>{blip(120,0.18,'sawtooth',0.22); setTimeout(()=>blip(600,0.2,'square',0.18),60);},
  skill:()=>{[880,1320,1760].forEach((f,i)=>setTimeout(()=>blip(f,0.16,'sine',0.2),i*70));},
  save:()=>{[300,500,760].forEach((f,i)=>setTimeout(()=>blip(f,0.16,'triangle',0.18),i*60));},
  extra:()=>{[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>blip(f,0.3,'square',0.2),i*100));},
  spin:(v)=>blip(300+v*260,0.05,'square',0.08),
  loop:(n)=>{blip(500+n*120,0.14,'sine',0.18); blip(750+n*120,0.1,'triangle',0.12);},
  tick:()=>blip(1200,0.03,'square',0.10),
  tilt:()=>{[200,150,110].forEach((f,i)=>setTimeout(()=>blip(f,0.4,'sawtooth',0.24),i*130));}
};

// ---------- state ----------
let state='title';     // title | serve | play | over
let score=0, best=0, ballsLeft=3;
let BALLS=[];                       // all balls in play (multiball)
let ball=null;                      // the ball being served (serve state only)
let plunger=0, plungerHeld=false;
let leftHeld=false, rightHeld=false;
let lFlip={a:REST,prev:REST,av:0}, rFlip={a:REST,prev:REST,av:0};
let shake=0, flashMsg='', flashT=0, combo=0;
let particles=[];

// ---------- N7 drop targets ----------
// Two banks; knocking down a whole bank lights a letter (N, then 7).
const TGT_LEN=30;
const targets=[
  {x:64,  y:452, side:'L', down:false, flash:0},
  {x:64,  y:498, side:'L', down:false, flash:0},
  {x:64,  y:544, side:'L', down:false, flash:0},
  {x:446, y:452, side:'R', down:false, flash:0},
  {x:446, y:498, side:'R', down:false, flash:0},
  {x:446, y:544, side:'R', down:false, flash:0},
];
function resetBank(side){ targets.forEach(t=>{ if(t.side===side) t.down=false; }); }
function bankDown(side){ return targets.filter(t=>t.side===side).every(t=>t.down); }

// ---------- mission / progression ----------
const MISSIONS=[
  {name:'COLLECTOR SWARM', goal:8,  desc:'HIT 8 BUMPERS'},
  {name:'REAPER ASSAULT',  goal:6,  desc:'HIT 6 TARGETS'},
  {name:'OMEGA RELAY',     goal:10, desc:'HIT 10 BUMPERS'},
];
let lit={N:false, seven:false};     // lit letters from bank completions
let mission=null;                   // {def, prog, timer}
let missionIdx=0;
let multiball=false;
let scoreMult=1;

// --- new systems ---
let ballSave=0;            // frames of ball-save protection remaining
let kickbackReady=true;    // left outlane kickback armed?
let skillLit=false;        // skill shot available on this launch
let skillWindow=0;         // frames left to collect the skill shot
let bonusPts=0;            // end-of-ball bonus accumulator
let bonusTally=null;       // {shown, target, timer} during the count-up
let comboChain=0, comboTimer=0;   // quick-succession hit chaining
let tilt=0, tiltWarn=0, tilted=false;  // nudge/tilt system
let loopCount=0, loopTimer=0;     // orbit loop combos
let screenFlash=0;         // white flash on big events
let extraAwarded={};       // score thresholds already awarded an extra ball
const EXTRA_AT=[75000,200000,400000];

// spinner sits in the upper-left orbit path
const spinner={x:96,y:300,r:26,spin:0,vel:0};
// orbit sensors: crossing the top arc left->right (or back) counts as a loop
const orbitZone={y1:190,y2:250};

function newBall(){
  ball={x:serve.x,y:serve.y,vx:0,vy:0,r:13,inLane:true,age:0}; BALLS=[]; plunger=0; state='serve';
  kickbackReady=true; skillLit=true; tilt=0; tilted=false; comboChain=0;
}
function startGame(){
  initAudio(); SFX.start(); score=0; ballsLeft=3; combo=0;
  lit={N:false,seven:false}; mission=null; missionIdx=0; multiball=false; scoreMult=1;
  targets.forEach(t=>{t.down=false;t.flash=0;}); particles=[];
  bonusPts=0; bonusTally=null; extraAwarded={}; loopCount=0;
  newBall(); state='serve'; flashMsg='';
}
function awardBonus(){
  // end-of-ball bonus tally: satisfying count-up
  if(bonusPts>0){ bonusTally={shown:0,target:bonusPts,timer:0}; }
  bonusPts=0;
}
function loseBall(){
  SFX.drain(); ballsLeft--; shake=14; combo=0;
  multiball=false; scoreMult=1; mission=null; comboChain=0;
  awardBonus();
  if(ballsLeft<=0){ best=Math.max(best,score); state='over'; SFX.over(); }
  else { flash('BALL LOST'); newBall(); }
}
function checkExtraBall(){
  for(const th of EXTRA_AT){
    if(score>=th && !extraAwarded[th]){
      extraAwarded[th]=true; ballsLeft++;
      SFX.extra(); flash('EXTRA BALL!'); screenFlash=1; shake=Math.max(shake,12);
      burst(W/2,H*0.5,'#7fffcf',36);
    }
  }
}
function addCombo(x,y){
  comboChain++; comboTimer=110;             // ~1.8s window to keep the chain alive
  if(comboChain>=3){
    const pts=250*comboChain*scoreMult;
    addScore(pts); popAt(x,y-24,'COMBO x'+comboChain);
    SFX.combo(Math.min(12,comboChain));
    if(comboChain%5===0){ flash('COMBO x'+comboChain+'!'); screenFlash=0.6; }
  }
}
function doKickback(bl){
  kickbackReady=false;
  bl.x=60; bl.y=H-140; bl.vx=1.2; bl.vy=-30;
  SFX.kickback(); flash('KICKBACK!'); shake=Math.max(shake,10);
  burst(60,H-140,'#7fc4ff',20);
}
function flash(m){ flashMsg=m; flashT=1400; }

function burst(x,y,color,n){
  for(let i=0;i<(n||14);i++){
    const a=Math.random()*Math.PI*2, sp=Math.random()*5+2;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color});
  }
}

function lightLetter(which){
  if(which==='L' && !lit.N){ lit.N=true; SFX.bank(); flash('N  LIT'); }
  if(which==='R' && !lit.seven){ lit.seven=true; SFX.bank(); flash('7  LIT'); }
  if(lit.N && lit.seven && !mission){ startMission(); }
}

function startMission(){
  const def=MISSIONS[missionIdx%MISSIONS.length];
  mission={def, prog:0, timer:1500};   // ~25s at 60fps
  scoreMult=3;
  lit={N:false,seven:false};
  SFX.mission(); flash(def.name);
  shake=Math.max(shake,10);
}

function completeMission(){
  const pts=25000;
  addScore(pts);
  SFX.jackpot(); flash('JACKPOT  +'+pts.toLocaleString());
  shake=Math.max(shake,16);
  burst(W/2,H*0.45,'#ffd24a',40);
  missionIdx++;
  mission=null; scoreMult=1;
  startMultiball();
}

function startMultiball(){
  if(multiball) return;
  multiball=true; scoreMult=2;
  SFX.multiball(); flash('MULTIBALL!');
  // release two extra balls from the top bumper area
  for(let i=0;i<2;i++){
    BALLS.push({x:W*0.5+(i?40:-40), y:220, vx:(i?3:-3), vy:2, r:13, inLane:false, age:0});
  }
}

// ---------- input ----------
const pointers=new Map();
function sideOf(clientX){ const rect=cv.getBoundingClientRect(); return (clientX-rect.left)<rect.width/2?'L':'R'; }
function refreshFlips(){ leftHeld=false; rightHeld=false;
  for(const s of pointers.values()){ if(s==='L')leftHeld=true; else rightHeld=true; } }
function down(id,x){ if(state==='title'){startGame();return;} if(state==='over'){startGame();return;}
  if(state==='serve'){ plungerHeld=true; pointers.set(id,'P'); return; }
  pointers.set(id,sideOf(x)); refreshFlips();
  if(leftHeld||rightHeld)SFX.flip();
}
function up(id){ const was=pointers.get(id); pointers.delete(id);
  if(was==='P'){ if(state==='serve')launch(); plungerHeld=pointers.size>0 && [...pointers.values()].includes('P'); }
  refreshFlips();
}
function launch(){ if(state!=='serve'||!ball)return;
  // SKILL SHOT: release in the sweet spot (0.62-0.78 power) for a bonus
  const p=plunger;
  ball.vy=-(28+p*8); ball.vx=-(1.0+p*2.0); ball.inLane=true; plunger=0; plungerHeld=false;
  BALLS=[ball]; ball=null;
  state='play'; SFX.launch();
  ballSave=360;                    // ~6s of ball-save protection
  skillWindow= (p>=0.62 && p<=0.78) ? 150 : 0;   // window to collect the skill award
  if(skillWindow>0){ flash('SKILL SHOT LIT'); }
}
cv.addEventListener('pointerdown',e=>{e.preventDefault(); initAudio(); down(e.pointerId,e.clientX);});
cv.addEventListener('pointerup',e=>{e.preventDefault(); up(e.pointerId);});
cv.addEventListener('pointercancel',e=>up(e.pointerId));
function nudge(dir){
  if(state!=='play'||tilted) return;
  BALLS.forEach(bl=>{ bl.vx+=dir*3.2; bl.vy-=1.2; });
  shake=Math.max(shake,7);
  tilt+=0.34;
  if(tilt>1){
    tilted=true; SFX.tilt(); flash('TILT!'); shake=20;
    // tilt kills the ball: flippers go dead, ball drains
    BALLS.forEach(bl=>{ bl.vy=Math.abs(bl.vy)+8; });
  } else if(tilt>0.66){ flash('CAREFUL...'); }
}
window.addEventListener('keydown',e=>{
  if(e.key==='z'||e.key==='Z'){ nudge(-1); }
  if(e.key==='c'||e.key==='C'){ nudge(1); }
  if(e.repeat)return; initAudio();
  if(['ArrowLeft','a','A','z','Z'].includes(e.key)){leftHeld=true;if(state==='play')SFX.flip();}
  if(['ArrowRight','d','D','/','x','X'].includes(e.key)){rightHeld=true;if(state==='play')SFX.flip();}
  if(e.key===' '){ e.preventDefault(); if(state==='serve')plungerHeld=true; }
  if(e.key==='Enter'||e.key===' '){ if(state==='title'||state==='over')startGame(); }
});
window.addEventListener('keyup',e=>{
  if(['ArrowLeft','a','A','z','Z'].includes(e.key))leftHeld=false;
  if(['ArrowRight','d','D','/','x','X'].includes(e.key))rightHeld=false;
  if(e.key===' '){ if(state==='serve')launch(); }
});

// ---------- physics helpers ----------
function closest(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1, L2=dx*dx+dy*dy||1;
  let t=((px-x1)*dx+(py-y1)*dy)/L2; t=Math.max(0,Math.min(1,t));
  return {x:x1+t*dx,y:y1+t*dy,t};
}
function reflect(ballv,nx,ny,rest){
  const d=ballv.vx*nx+ballv.vy*ny;
  ballv.vx-=(1+rest)*d*nx; ballv.vy-=(1+rest)*d*ny;
}
function flipTip(f,p,side){ return {x:p.x+side*FLEN*Math.cos(f.a), y:p.y+FLEN*Math.sin(f.a)}; }
const SUBSTEPS=8, FSTEP=0.42;
function flipStep(f,target){            // advance one substep; sets f.av to per-frame rate for the kick
  const inc=FSTEP/SUBSTEPS;
  if(Math.abs(f.a-target)<=inc){ f.a=target; f.av=0; }
  else { const dir=target<f.a?-1:1; f.a+=dir*inc; f.av=dir*FSTEP; }
}

function physics(){
  if(BALLS.length===0) return;
  const SUB=SUBSTEPS;
  // gravity + speed cap, once per frame per ball
  for(const bl of BALLS){
    bl.vy+=0.50;                                   // gravity (px/frame)
    const sp=Math.hypot(bl.vx,bl.vy), MAX=34;      // cap; MAX/SUB < r so no tunneling
    if(sp>MAX){ bl.vx*=MAX/sp; bl.vy*=MAX/sp; }
  }
  for(let s=0;s<SUB;s++){
    // flippers swept once per substep (shared by all balls); dead while tilted
    flipStep(lFlip, (leftHeld&&!tilted)?REST-SWING:REST);
    flipStep(rFlip, (rightHeld&&!tilted)?REST-SWING:REST);

    for(let bi=BALLS.length-1; bi>=0; bi--){
      const bl=BALLS[bi];
      if(bl.bumpCool>0) bl.bumpCool--;
      bl.x+=bl.vx/SUB; bl.y+=bl.vy/SUB;

      // lane keeps ball on right until it clears the top, then opens to field
      if(bl.inLane){
        if(bl.x<laneX+bl.r && bl.y>205){ bl.x=laneX+bl.r; if(bl.vx<0)bl.vx*=-0.3; }
        if(bl.x>W-b-bl.r){ bl.x=W-b-bl.r; bl.vx*=-0.4; }
        if(bl.y<205) bl.inLane=false;
      } else if(bl.x>laneX-bl.r && bl.y<232 && bl.vx>=0){
        // one-way gate: once in play, the ball can't drop back into the plunger lane
        bl.x=laneX-bl.r; bl.vx=-Math.abs(bl.vx)*0.4-0.6;
      }

      // walls
      for(const wl of walls){
        const c=closest(bl.x,bl.y,wl.x1,wl.y1,wl.x2,wl.y2);
        let nx=bl.x-c.x, ny=bl.y-c.y, d=Math.hypot(nx,ny);
        if(d<bl.r && d>0.0001){ nx/=d; ny/=d;
          bl.x=c.x+nx*bl.r; bl.y=c.y+ny*bl.r;
          const before=Math.hypot(bl.vx,bl.vy);
          reflect(bl,nx,ny,0.62*wl.k);
          if(before>1.4)SFX.wall();
        }
      }

      // drop targets (only collide while standing)
      for(const tg of targets){
        if(tg.down) continue;
        const c=closest(bl.x,bl.y,tg.x,tg.y-TGT_LEN/2,tg.x,tg.y+TGT_LEN/2);
        let nx=bl.x-c.x, ny=bl.y-c.y, d=Math.hypot(nx,ny);
        const R=bl.r+7;
        if(d<R && d>0.0001){ nx/=d; ny/=d;
          bl.x=c.x+nx*(R+2); bl.y=c.y+ny*(R+2);
          reflect(bl,nx,ny,0.5);
          { const vn=bl.vx*nx+bl.vy*ny, MINOUT=4;
            if(vn<MINOUT){ const add=MINOUT-vn; bl.vx+=nx*add; bl.vy+=ny*add; } }
          tg.down=true; tg.flash=1;
          shake=Math.max(shake,7);
          const pts=500*scoreMult;
          addScore(pts); popAt(tg.x,tg.y,'+'+pts); SFX.target();
          burst(tg.x,tg.y,'#ffd24a',10);
          addCombo(tg.x,tg.y); bonusPts+=1000;
          if(skillWindow>0){ skillWindow=0; const sp=5000*scoreMult; addScore(sp);
            SFX.skill(); flash('SKILL SHOT  +'+sp.toLocaleString()); screenFlash=0.8; }
          if(mission && mission.def.desc.indexOf('TARGET')>=0) mission.prog++;
          if(bankDown(tg.side)){
            const side=tg.side;
            setTimeout(()=>resetBank(side),700);
            addScore(2000*scoreMult); popAt(tg.x,tg.y-30,'+'+(2000*scoreMult));
            burst(tg.x,tg.y,'#5aa0ff',22);
            lightLetter(side);
          }
        }
      }

      // bumpers
      for(const bp of bumpers){
        let nx=bl.x-bp.x, ny=bl.y-bp.y, d=Math.hypot(nx,ny);
        if(d<bp.r+bl.r && d>0.0001){ nx/=d; ny/=d;
          // pop clear of the surface (not exactly touching) so it can't re-collide next step
          bl.x=bp.x+nx*(bp.r+bl.r+2.5); bl.y=bp.y+ny*(bp.r+bl.r+2.5);
          reflect(bl,nx,ny,0.5);
          bl.vx+=nx*9; bl.vy+=ny*9;            // active kick
          // guarantee it actually leaves: enforce a minimum outward (radial) speed
          const vn=bl.vx*nx+bl.vy*ny, MINOUT=8;
          if(vn<MINOUT){ const add=MINOUT-vn; bl.vx+=nx*add; bl.vy+=ny*add; }
          // brief cooldown stops one graze from scoring several times across substeps
          if((bl.bumpCool||0)<=0){
            bp.flash=1; shake=Math.max(shake,6);
            combo++; const pts=100*Math.min(8,combo)*scoreMult;
            addScore(pts); popAt(bp.x,bp.y,'+'+pts); SFX.bump();
            burst(bp.x,bp.y,'#7fc4ff',6);
            addCombo(bp.x,bp.y); bonusPts+=250;
            if(skillWindow>0){ skillWindow=0; const sp=5000*scoreMult; addScore(sp);
              SFX.skill(); flash('SKILL SHOT  +'+sp.toLocaleString()); screenFlash=0.8; }
            if(mission && mission.def.desc.indexOf('BUMPER')>=0) mission.prog++;
          }
          bl.bumpCool=3;
        }
      }

      flipperCollide(bl,lFlip,LP,1,leftHeld);
      flipperCollide(bl,rFlip,RP,-1,rightHeld);

      // ---- SPINNER: rips when the ball passes through ----
      {
        const dsx=bl.x-spinner.x, dsy=bl.y-spinner.y;
        if(Math.hypot(dsx,dsy)<spinner.r+bl.r){
          const sp=Math.hypot(bl.vx,bl.vy);
          if(sp>2 && (bl.spinCool||0)<=0){
            spinner.vel=Math.min(1,sp/22);
            const pts=Math.round(120*spinner.vel*10)*scoreMult;
            addScore(pts); bonusPts+=200;
            SFX.spin(spinner.vel);
            popAt(spinner.x,spinner.y-18,'+'+pts);
            bl.spinCool=8;
          }
        }
        if(bl.spinCool>0) bl.spinCool--;
      }

      // ---- ORBIT LOOPS: cross the top arc side to side ----
      if(bl.y>orbitZone.y1 && bl.y<orbitZone.y2 && Math.abs(bl.vx)>4){
        const side = bl.vx>0 ? 'R' : 'L';
        if(bl.lastOrbit && bl.lastOrbit!==side && (bl.orbitCool||0)<=0){
          loopCount++; loopTimer=180;
          const pts=1500*Math.min(6,loopCount)*scoreMult;
          addScore(pts); bonusPts+=500;
          SFX.loop(Math.min(6,loopCount));
          popAt(bl.x,bl.y,'LOOP x'+loopCount+'  +'+pts);
          burst(bl.x,bl.y,'#7fffcf',10);
          if(loopCount===3){ flash('LOOP MASTER!'); screenFlash=0.6; }
          bl.orbitCool=30;
        }
        bl.lastOrbit=side;
      }
      if(bl.orbitCool>0) bl.orbitCool--;

      // ---- LEFT OUTLANE KICKBACK ----
      if(kickbackReady && bl.x<105 && bl.y>H-190 && bl.vy>0){
        doKickback(bl);
      }

      // drain
      if(bl.y>H+24){
        if(ballSave>0 && BALLS.length===1){
          // BALL SAVE: put it right back into play
          bl.x=serve.x; bl.y=serve.y; bl.vx=-1.2; bl.vy=-30; bl.inLane=true;
          ballSave=Math.min(ballSave,120);
          SFX.save(); flash('BALL SAVED'); burst(serve.x,serve.y,'#7fffcf',18);
        } else {
          BALLS.splice(bi,1);
          if(BALLS.length===0){ loseBall(); return; }
          else { SFX.wall(); flash('BALL DRAINED'); }   // multiball: lose one, keep playing
        }
      }
    }
  }
  BALLS.forEach(bl=>bl.age++);
  // mission timer
  if(mission){
    mission.timer--;
    if(mission.prog>=mission.def.goal){ completeMission(); }
    else if(mission.timer<=0){ mission=null; scoreMult=multiball?2:1; flash('MISSION FAILED'); }
  }
}

function flipperCollide(bl,f,p,side,held){
  const tip=flipTip(f,p,side);
  const c=closest(bl.x,bl.y,p.x,p.y,tip.x,tip.y);
  let nx=bl.x-c.x, ny=bl.y-c.y, d=Math.hypot(nx,ny);
  const R=bl.r+FTHICK;
  if(d<R && d>0.0001){ nx/=d; ny/=d;
    bl.x=c.x+nx*R; bl.y=c.y+ny*R;
    if(Math.abs(f.av)>0.02){               // actively flipping -> clean, predictable launch
      const r=Math.hypot(c.x-p.x,c.y-p.y);
      const power = 17 + 16*Math.min(1, r/FLEN);   // stronger the further out the ball sits
      bl.x=c.x+nx*(R+2); bl.y=c.y+ny*(R+2);     // pop off the surface so it can't cling
      bl.vx = side*0.24*power;            // only a hint toward center (~13 deg from vertical)
      bl.vy = -0.97*power;                // strongly up
    } else {                                // resting/sliding on the bat -> lively, not sticky
      reflect(bl,nx,ny,0.34);             // real bounce off the bat rubber
      const vn=bl.vx*nx+bl.vy*ny;       // only cancel the very faintest jitter so it can still settle
      if(vn>0 && vn<0.6){ bl.vx-=vn*nx; bl.vy-=vn*ny; }
    }
  }
}
function updateFlippers(){
  const step=0.42;
  [ [lFlip,1,leftHeld], [rFlip,-1,rightHeld] ].forEach(([f,side,held])=>{
    f.prev=f.a;
    const base = REST;
    const up   = REST-SWING;
    const target = held?up:base;
    if(f.a<target) f.a=Math.min(target,f.a+step);
    else if(f.a>target) f.a=Math.max(target,f.a-step);
    f.av=f.a-f.prev;
  });
}

function addScore(p){ score+=p; }
let pops=[];
function popAt(x,y,t){ pops.push({x,y,t,life:0}); }

// ---------- update ----------
function update(){
  if(state==='serve'){
    if(plungerHeld) plunger=Math.min(1,plunger+0.018);
    if(ball){ ball.x=serve.x; ball.y=serve.y - plunger*22; }
  }
  if(state==='serve'){ updateFlippers(); }   // visual sweep before launch
  if(state==='play'){ physics();
    // safety net: if a ball lingers low in the plunger lane, auto-relaunch (never get stuck)
    BALLS.forEach(bl=>{
      if(bl.x>laneX-2 && bl.y>620 && bl.vy>-2){
        bl.stall=(bl.stall||0)+1;
        if(bl.stall>40){ bl.vy=-30; bl.vx=-1.4; bl.inLane=true; bl.stall=0; SFX.launch(); }
      } else { bl.stall=0; }
    });
  }
  if(shake>0)shake-=0.7;
  if(flashT>0)flashT-=16;
  if(screenFlash>0)screenFlash-=0.06;
  if(ballSave>0){ ballSave--; if(ballSave===0 && state==='play') flash('SAVE OVER'); }
  if(skillWindow>0) skillWindow--;
  if(comboTimer>0){ comboTimer--; if(comboTimer===0) comboChain=0; }
  if(loopTimer>0){ loopTimer--; if(loopTimer===0) loopCount=0; }
  if(tilt>0) tilt-=0.012;
  // spinner spin-down
  if(spinner.vel>0){ spinner.spin+=spinner.vel*0.9; spinner.vel*=0.965; if(spinner.vel<0.01)spinner.vel=0; }
  // end-of-ball bonus count-up
  if(bonusTally){
    bonusTally.timer++;
    const step=Math.max(250,Math.round(bonusTally.target/40));
    if(bonusTally.shown<bonusTally.target){
      bonusTally.shown=Math.min(bonusTally.target,bonusTally.shown+step);
      score+=step; if(score>0 && bonusTally.timer%2===0) SFX.tick();
    } else if(bonusTally.timer>90){ bonusTally=null; checkExtraBall(); }
  }
  checkExtraBall();
  bumpers.forEach(bp=>{ if(bp.flash>0)bp.flash-=0.08; });
  targets.forEach(t=>{ if(t.flash>0)t.flash-=0.06; });
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.vx*=0.96; p.vy*=0.96; p.life-=0.03; });
  particles=particles.filter(p=>p.life>0);
  pops.forEach(p=>{p.life+=16;p.y-=0.6;}); pops=pops.filter(p=>p.life<900);
}

// ---------- draw ----------
let hexPat=null;
function buildHex(){
  const c=document.createElement('canvas'); c.width=48;c.height=42; const g=c.getContext('2d');
  g.strokeStyle='rgba(40,70,120,0.16)'; g.lineWidth=1.4;
  function hx(cx,cy,r){ g.beginPath(); for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a); i?g.lineTo(x,y):g.moveTo(x,y);} g.closePath(); g.stroke(); }
  hx(24,21,15); hx(0,0,15); hx(48,0,15); hx(0,42,15); hx(48,42,15);
  hexPat=ctx.createPattern(c,'repeat');
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawTable(){
  // table art (cover-fit), with a subtle darken so play elements pop
  const t=IMG.table;
  if(t&&t.complete){
    const s=Math.max(W/t.width,H/t.height), rw=t.width*s, rh=t.height*s;
    ctx.drawImage(t,(W-rw)/2,(H-rh)/2,rw,rh);
  } else { ctx.fillStyle='#0a0f1e'; ctx.fillRect(0,0,W,H); }
  ctx.fillStyle='rgba(5,8,16,0.30)'; ctx.fillRect(0,0,W,H);
  // dark strip behind HUD for readability
  const hg=ctx.createLinearGradient(0,0,0,70); hg.addColorStop(0,'rgba(3,5,10,0.7)'); hg.addColorStop(1,'rgba(3,5,10,0)');
  ctx.fillStyle=hg; ctx.fillRect(0,0,W,70);

  // physics walls as a subtle neon guide (thin, so the art shows through)
  ctx.lineCap='round';
  ctx.strokeStyle='rgba(70,150,255,0.16)'; ctx.lineWidth=6;
  walls.forEach(wl=>{ctx.beginPath();ctx.moveTo(wl.x1,wl.y1);ctx.lineTo(wl.x2,wl.y2);ctx.stroke();});
  ctx.strokeStyle='rgba(120,190,255,0.55)'; ctx.lineWidth=2;
  walls.forEach(wl=>{ctx.beginPath();ctx.moveTo(wl.x1,wl.y1);ctx.lineTo(wl.x2,wl.y2);ctx.stroke();});
}
function drawBumpers(){
  bumpers.forEach((bp,i)=>{
    const img=IMG[bp.art];
    const glow=0.4+0.6*Math.max(0,bp.flash);
    ctx.save();
    ctx.shadowColor='rgba(60,130,255,'+(0.5+0.5*Math.max(0,bp.flash))+')'; ctx.shadowBlur=22+30*Math.max(0,bp.flash);
    if(img&&img.complete){ const iw=bp.r*2.5, ih=iw*img.height/img.width; ctx.drawImage(img,bp.x-iw/2,bp.y-ih*0.62,iw,ih); }
    else { ctx.fillStyle='#2a4a8a'; ctx.beginPath(); ctx.arc(bp.x,bp.y,bp.r,0,7); ctx.fill(); }
    ctx.restore();
    if(bp.flash>0){ ctx.strokeStyle='rgba(120,180,255,'+bp.flash+')'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(bp.x,bp.y,bp.r+6+10*(1-bp.flash),0,7); ctx.stroke(); }
  });
}
function drawFlipper(f,p,side){
  const tip=flipTip(f,p,side);
  ctx.save(); ctx.shadowColor='rgba(220,40,40,0.6)'; ctx.shadowBlur=12;
  ctx.lineCap='round'; ctx.strokeStyle='#d6443a'; ctx.lineWidth=FTHICK*2;
  ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(tip.x,tip.y); ctx.stroke();
  ctx.strokeStyle='#ff8a7a'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(tip.x,tip.y); ctx.stroke();
  ctx.restore();
  ctx.fillStyle='#1a2238'; ctx.beginPath(); ctx.arc(p.x,p.y,8,0,7); ctx.fill();
  ctx.strokeStyle='#5aa0ff'; ctx.lineWidth=2; ctx.stroke();
}
function drawOneBall(bl){
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(bl.x,bl.y+bl.r*0.8,bl.r*0.9,bl.r*0.4,0,0,7); ctx.fill();
  const img=IMG.ball;
  if(img&&img.complete){ ctx.shadowColor='rgba(150,200,255,0.5)'; ctx.shadowBlur=10; ctx.drawImage(img,bl.x-bl.r-2,bl.y-bl.r-2,(bl.r+2)*2,(bl.r+2)*2); }
  else { ctx.fillStyle='#cfd6dd'; ctx.beginPath(); ctx.arc(bl.x,bl.y,bl.r,0,7); ctx.fill(); }
  ctx.restore();
}
function drawBall(){
  BALLS.forEach(drawOneBall);
  if(ball) drawOneBall(ball);      // the ball waiting on the plunger
}
function drawTargets(){
  targets.forEach(t=>{
    const h=TGT_LEN, w=11;
    ctx.save();
    if(t.down){
      ctx.globalAlpha=0.25; ctx.fillStyle='#2a3a58';
      rr(t.x-w/2,t.y-h/2+h*0.35,w,h*0.3,3); ctx.fill();
    } else {
      const f=Math.max(0,t.flash);
      ctx.shadowColor='rgba(255,210,74,'+(0.4+0.6*f)+')'; ctx.shadowBlur=10+20*f;
      ctx.fillStyle=f>0?'#ffe89a':'#d6443a';
      rr(t.x-w/2,t.y-h/2,w,h,3); ctx.fill();
      ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(255,240,200,0.8)'; ctx.lineWidth=1.5;
      rr(t.x-w/2,t.y-h/2,w,h,3); ctx.stroke();
    }
    ctx.restore();
  });
  ctx.globalAlpha=1;
}
function drawSpinner(){
  ctx.save();
  ctx.translate(spinner.x,spinner.y);
  const glow=Math.min(1,spinner.vel*2);
  ctx.shadowColor='rgba(127,255,207,'+(0.3+0.7*glow)+')'; ctx.shadowBlur=10+26*glow;
  ctx.rotate(spinner.spin);
  ctx.fillStyle=glow>0.05?'#7fffcf':'#3d6a8a';
  for(let i=0;i<3;i++){
    ctx.rotate(Math.PI*2/3);
    rr(-3,-spinner.r*0.85,6,spinner.r*1.7,3); ctx.fill();
  }
  ctx.restore();
  ctx.save();
  ctx.strokeStyle='rgba(127,255,207,0.35)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(spinner.x,spinner.y,spinner.r,0,7); ctx.stroke();
  ctx.restore();
}
function drawKickbackLamp(){
  const x=52,y=H-176;
  ctx.save();
  ctx.shadowColor=kickbackReady?'rgba(127,196,255,0.9)':'rgba(60,70,90,0.4)';
  ctx.shadowBlur=kickbackReady?16:0;
  ctx.fillStyle=kickbackReady?'#7fc4ff':'rgba(70,84,110,0.5)';
  ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.fill();
  ctx.restore();
  ctx.fillStyle=kickbackReady?'#7fc4ff':'rgba(90,107,140,0.6)';
  ctx.font='bold 9px "Trebuchet MS"'; ctx.textAlign='center';
  ctx.fillText('KICK',x,y+20); ctx.textAlign='left';
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,2.6,0,7); ctx.fill();
  });
  ctx.globalAlpha=1;
}
function drawHUD(){
  ctx.fillStyle='#cfe0ff'; ctx.font='bold 22px "Trebuchet MS"'; ctx.textAlign='left';
  ctx.fillText(score.toLocaleString(), b+2, 40);
  ctx.font='11px "Trebuchet MS"'; ctx.fillStyle='#5b6b8c'; ctx.fillText('SCORE',b+3,52);
  ctx.textAlign='right'; ctx.fillStyle='#d6443a'; ctx.font='bold 20px "Trebuchet MS"';
  let bd=''; for(let i=0;i<ballsLeft;i++)bd+='●'; ctx.fillText(bd||'—',W-b-2,40);
  ctx.fillStyle='#5b6b8c'; ctx.font='11px "Trebuchet MS"'; ctx.fillText('BALLS',W-b-3,52);
  ctx.textAlign='left';
  // ---- N7 status: lit letters + multiplier ----
  ctx.textAlign='center';
  ctx.font='bold 19px "Trebuchet MS"';
  ctx.fillStyle = lit.N ? '#ffd24a' : 'rgba(120,140,180,0.35)';
  ctx.fillText('N', W/2-16, 42);
  ctx.fillStyle = lit.seven ? '#ffd24a' : 'rgba(120,140,180,0.35)';
  ctx.fillText('7', W/2+16, 42);
  if(scoreMult>1){
    ctx.fillStyle='#7fffcf'; ctx.font='bold 14px "Trebuchet MS"';
    ctx.fillText('x'+scoreMult, W/2, 60);
  }
  if(multiball){
    ctx.fillStyle='#ff8a7a'; ctx.font='bold 12px "Trebuchet MS"';
    ctx.fillText('MULTIBALL', W/2, 74);
  }

  // ---- ball save / skill / combo / loop indicators ----
  let sy=92;
  if(ballSave>0){
    ctx.fillStyle='#7fffcf'; ctx.font='bold 13px "Trebuchet MS"';
    ctx.fillText('BALL SAVE  '+Math.ceil(ballSave/60)+'s', W/2, sy); sy+=18;
  }
  if(skillWindow>0){
    ctx.fillStyle='#ffd24a'; ctx.font='bold 13px "Trebuchet MS"';
    ctx.fillText('SKILL SHOT LIT', W/2, sy); sy+=18;
  }
  if(comboChain>=3){
    ctx.fillStyle='#ff8a7a'; ctx.font='bold 15px "Trebuchet MS"';
    ctx.fillText('COMBO x'+comboChain, W/2, sy); sy+=18;
  }
  if(loopCount>0){
    ctx.fillStyle='#7fffcf'; ctx.font='bold 13px "Trebuchet MS"';
    ctx.fillText('LOOP x'+loopCount, W/2, sy); sy+=18;
  }

  // ---- tilt meter (bottom-left) ----
  if(tilt>0.05){
    const tw=70;
    ctx.fillStyle='rgba(255,255,255,0.12)'; rr(b+2,H-30,tw,6,3); ctx.fill();
    ctx.fillStyle= tilt>0.66?'#ff5a4a':'#ffd24a'; rr(b+2,H-30,tw*Math.min(1,tilt),6,3); ctx.fill();
    ctx.fillStyle='#7e90b4'; ctx.font='9px "Trebuchet MS"'; ctx.textAlign='left';
    ctx.fillText('TILT',b+2,H-34);
  }

  // ---- end-of-ball bonus tally ----
  if(bonusTally){
    ctx.textAlign='center';
    ctx.fillStyle='rgba(4,8,18,0.85)'; rr(W/2-130,H*0.44-40,260,86,10); ctx.fill();
    ctx.strokeStyle='rgba(255,210,74,0.8)'; ctx.lineWidth=2; rr(W/2-130,H*0.44-40,260,86,10); ctx.stroke();
    ctx.fillStyle='#ffd24a'; ctx.font='bold 18px "Trebuchet MS"';
    ctx.fillText('BONUS', W/2, H*0.44-14);
    ctx.fillStyle='#e8eefc'; ctx.font='bold 30px "Trebuchet MS"';
    ctx.fillText(bonusTally.shown.toLocaleString(), W/2, H*0.44+22);
  }

  // ---- active mission banner ----
  if(mission){
    const my=96;
    ctx.fillStyle='rgba(4,8,18,0.72)'; rr(W/2-150,my-20,300,44,8); ctx.fill();
    ctx.strokeStyle='rgba(214,68,58,0.8)'; ctx.lineWidth=2; rr(W/2-150,my-20,300,44,8); ctx.stroke();
    ctx.fillStyle='#ff8a7a'; ctx.font='bold 15px "Trebuchet MS"';
    ctx.fillText(mission.def.name, W/2, my-2);
    ctx.fillStyle='#9fb4d8'; ctx.font='12px "Trebuchet MS"';
    ctx.fillText(mission.def.desc+'   '+mission.prog+'/'+mission.def.goal, W/2, my+16);
    // timer bar
    const tw=280*(mission.timer/1500);
    ctx.fillStyle='rgba(255,255,255,0.12)'; rr(W/2-140,my+22,280,4,2); ctx.fill();
    ctx.fillStyle='#ffd24a'; rr(W/2-140,my+22,Math.max(0,tw),4,2); ctx.fill();
  }
  ctx.textAlign='left';

  if(flashT>0){ ctx.globalAlpha=Math.min(1,flashT/500); ctx.textAlign='center';
    ctx.fillStyle='#ffd24a'; ctx.font='bold 30px "Trebuchet MS"'; ctx.fillText(flashMsg,W/2,H*0.4);
    ctx.textAlign='left'; ctx.globalAlpha=1; }
  // pops
  pops.forEach(p=>{ ctx.globalAlpha=Math.max(0,1-p.life/900); ctx.fillStyle='#aee0ff'; ctx.font='bold 15px "Trebuchet MS"'; ctx.textAlign='center'; ctx.fillText(p.t,p.x,p.y); });
  ctx.globalAlpha=1; ctx.textAlign='left';
}
function drawServe(){
  if(state!=='serve')return;
  // power meter on the right lane
  const mx=W-b-12, my0=H-90, mh=160;
  ctx.fillStyle='rgba(255,255,255,0.08)'; rr(mx-6,my0-mh,12,mh,6); ctx.fill();
  ctx.fillStyle='#d6443a'; rr(mx-6,my0-mh*plunger,12,mh*plunger,6); ctx.fill();
  ctx.fillStyle='#9fb4d8'; ctx.font='bold 13px "Trebuchet MS"'; ctx.textAlign='center';
  ctx.fillText('HOLD TO LAUNCH',W/2,H-40); ctx.textAlign='left';
}
function overlay(title,sub){
  ctx.fillStyle='rgba(4,7,14,0.82)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#d6443a'; ctx.font='bold 54px "Trebuchet MS"'; ctx.fillText('N7',W/2,H*0.34);
  ctx.fillStyle='#e8eefc'; ctx.font='bold 34px "Trebuchet MS"'; ctx.fillText(title,W/2,H*0.42);
  ctx.fillStyle='#7e90b4'; ctx.font='16px "Trebuchet MS"'; ctx.fillText(sub,W/2,H*0.42+34);
  if(best>0){ctx.fillStyle='#5b6b8c'; ctx.font='14px "Trebuchet MS"'; ctx.fillText('BEST  '+best.toLocaleString(),W/2,H*0.42+62);}
  ctx.textAlign='left';
}

function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const sh=shake>0?(Math.random()-0.5)*shake:0;
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(sh,sh*0.5);
  drawTable(); drawTargets(); drawSpinner(); drawBumpers(); drawKickbackLamp();
  drawFlipper(lFlip,LP,1); drawFlipper(rFlip,RP,-1);
  drawBall(); drawParticles(); drawServe(); drawHUD();
  ctx.restore();
  if(screenFlash>0){ ctx.fillStyle='rgba(255,255,255,'+(screenFlash*0.5)+')'; ctx.fillRect(0,0,W,H); }
  if(tilted){ ctx.fillStyle='rgba(120,0,0,0.30)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ff5a4a'; ctx.font='bold 46px "Trebuchet MS"'; ctx.textAlign='center';
    ctx.fillText('TILT',W/2,H*0.5); ctx.textAlign='left'; }
  if(state==='title') overlay('PINBALL','Targets · missions · multiball · Z/C nudge');
  if(state==='over') overlay('GAME OVER','Tap to play again · '+score.toLocaleString());
  ctx.fillStyle='rgba(140,170,220,0.55)'; ctx.font='12px "Trebuchet MS"'; ctx.textAlign='left';
  ctx.fillText('v14', 6, H-8);
  if(!ready()){ ctx.fillStyle='rgba(4,7,14,0.9)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#5aa0ff'; ctx.font='16px "Trebuchet MS"'; ctx.textAlign='center'; ctx.fillText('CALIBRATING…',W/2,H/2); ctx.textAlign='left'; }
}

// ---------- loop ----------
function loop(){ update(); draw(); requestAnimationFrame(loop); }
buildHex(); loop();
</script>
