<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>King of KOD — King's Advance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{--gold:#c9a24a; --steel:#d8dee8; --red:#d6443a; --hp:#5fbf57;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; background:#05060a; color:var(--steel);
    font-family:'VT323',monospace; overflow:hidden; height:100%;}
  body{display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; min-height:100dvh; touch-action:none;}
  #stage{position:relative; width:min(100vw, calc(100dvh * 16 / 9));
    aspect-ratio:16/9; max-width:1100px; margin:auto;}
  canvas{display:block; width:100%; height:100%; background:#0a0b12;
    image-rendering:pixelated; border:1px solid #1c2434;}

  /* overlays */
  .screen{position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:20px;
    background:radial-gradient(120% 90% at 50% 25%, rgba(40,30,60,.7), rgba(3,4,8,.92));}
  .screen.hide{display:none;}
  .big{font-family:'Press Start 2P',monospace; color:var(--gold);
    font-size:clamp(15px,4.6vw,30px); line-height:1.6; text-shadow:3px 3px 0 #000;}
  .sub{font-size:clamp(16px,3vw,22px); color:#9aa7b8; margin:12px 0 22px; max-width:440px; line-height:1.3;}
  .cta{font-family:'Press Start 2P',monospace; font-size:13px; color:#0c1a2e;
    background:linear-gradient(180deg,#e7c468,var(--gold)); border:none; padding:15px 26px;
    border-radius:3px; cursor:pointer; box-shadow:0 4px 0 #6b531f; letter-spacing:1px;}
  .cta:active{transform:translateY(3px); box-shadow:0 1px 0 #6b531f;}
  .hint{font-size:17px; color:#7d8a9c; margin-top:18px; line-height:1.5;}
  .crown{font-size:40px; filter:drop-shadow(0 0 12px var(--gold)); margin-bottom:4px;}

  /* touch controls */
  #pad{position:absolute; inset:0; pointer-events:none; z-index:10;}
  .tbtn{position:absolute; width:clamp(56px,13vh,90px); height:clamp(56px,13vh,90px);
    bottom:calc(env(safe-area-inset-bottom) + clamp(10px,4vh,30px));
    border-radius:50%; background:rgba(18,26,42,.6); border:2px solid var(--gold); color:var(--gold);
    font-family:'Press Start 2P',monospace; font-size:clamp(15px,3.2vh,22px); display:flex;
    align-items:center; justify-content:center; pointer-events:auto; box-shadow:0 3px 0 rgba(0,0,0,.5);}
  .tbtn:active{transform:translateY(2px); background:rgba(40,54,80,.85);}
  #bLeft{left:calc(env(safe-area-inset-left) + 14px);}
  #bRight{left:calc(env(safe-area-inset-left) + 14px + clamp(56px,13vh,90px) + 12px);}
  #bAtk{right:calc(env(safe-area-inset-right) + 14px);
    width:clamp(66px,15vh,104px); height:clamp(66px,15vh,104px);
    border-color:#e0b84a; font-size:clamp(22px,4.2vh,32px);}
  #bJump{right:calc(env(safe-area-inset-right) + 14px + clamp(66px,15vh,104px) + 12px);}
  .pad-hide{display:none!important;}

  /* fullscreen button */
  #fsBtn{position:absolute; top:calc(env(safe-area-inset-top) + 8px);
    right:calc(env(safe-area-inset-right) + 8px); z-index:12; width:40px; height:40px;
    border-radius:6px; background:rgba(18,26,42,.6); border:1px solid var(--gold); color:var(--gold);
    font-size:20px; display:none; align-items:center; justify-content:center; pointer-events:auto;}
  #fsBtn:active{background:rgba(40,54,80,.85);}

  /* rotate-to-landscape prompt (touch + portrait only) */
  #rotate{position:fixed; inset:0; z-index:60; display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:30px;
    background:radial-gradient(120% 90% at 50% 30%, #11203a, #03060c 80%); color:var(--steel);}
  #rotate .ico{font-size:64px; animation:rot 2s ease-in-out infinite;}
  @keyframes rot{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  #rotate .t{font-family:'Press Start 2P',monospace; color:var(--gold); font-size:16px; margin-top:18px;}
  #rotate .s{font-size:20px; color:#9aa7b8; margin-top:10px;}
  #rotate .tap{font-size:17px; color:var(--gold); margin-top:22px; border:1px solid var(--gold);
    padding:10px 18px; border-radius:4px;}
  #rotate.gone{display:none!important;}
  @media (orientation:portrait) and (pointer:coarse){ #rotate:not(.gone){display:flex;} }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>

  <div id="pad" class="pad-hide">
    <div class="tbtn" id="bLeft">◀</div>
    <div class="tbtn" id="bRight">▶</div>
    <div class="tbtn" id="bJump">⤒</div>
    <div class="tbtn" id="bAtk">⚔</div>
  </div>
  <div id="fsBtn">⛶</div>

  <div class="screen" id="loadScreen">
    <div class="crown">♛</div>
    <div class="big">KING'S ADVANCE</div>
    <div class="sub" id="loadMsg">Forging the kingdom...</div>
  </div>

  <div class="screen hide" id="titleScreen">
    <div class="crown">♛</div>
    <div class="big">KING'S ADVANCE</div>
    <div class="sub">The shadow host marches on your castle.<br>Cut a path to the gate.</div>
    <button class="cta" id="startBtn">BEGIN MARCH</button>
    <div class="hint" id="ctrlHint"></div>
  </div>

  <div class="screen hide" id="endScreen">
    <div class="big" id="endTitle">THE GATE IS YOURS</div>
    <div class="sub" id="endMsg"></div>
    <button class="cta" id="againBtn">MARCH AGAIN</button>
  </div>

  <div id="rotate">
    <div class="ico">📱</div>
    <div class="t">ROTATE YOUR PHONE</div>
    <div class="s">King's Advance plays best in landscape.</div>
    <div class="tap">▶ TAP TO PLAY ANYWAY</div>
  </div>
</div>

<script>
const ASSETS = {"idle": "assets/idle.png", "atk0": "assets/atk0.png", "atk1": "assets/atk1.png", "atk2": "assets/atk2.png", "title": "assets/title.png", "walk0": "assets/walk0.png", "walk1": "assets/walk1.png", "walk2": "assets/walk2.png", "walk3": "assets/walk3.png", "walk4": "assets/walk4.png", "walk5": "assets/walk5.png", "walk6": "assets/walk6.png", "walk7": "assets/walk7.png", "bg": "assets/bg.jpg", "ground": "assets/ground.jpg", "slash": "assets/slash.png", "bIdle": "assets/bIdle.png", "bIdle2": "assets/bIdle2.png", "bWind": "assets/bWind.png", "bSwing": "assets/bSwing.png", "bFollow": "assets/bFollow.png", "bCharge": "assets/bCharge.png", "bHurt": "assets/bHurt.png", "bDown": "assets/bDown.png", "bWalk0": "assets/bWalk0.png", "bWalk1": "assets/bWalk1.png", "bWalk2": "assets/bWalk2.png", "bWalk3": "assets/bWalk3.png", "bWalk4": "assets/bWalk4.png", "bWalk5": "assets/bWalk5.png", "bWalk6": "assets/bWalk6.png", "bWalk7": "assets/bWalk7.png", "sWalk0": "assets/sWalk0.png", "sWalk1": "assets/sWalk1.png", "sWalk2": "assets/sWalk2.png", "sWalk3": "assets/sWalk3.png", "sWalk4": "assets/sWalk4.png", "sWalk5": "assets/sWalk5.png", "sWalk6": "assets/sWalk6.png", "sWalk7": "assets/sWalk7.png", "sIdle": "assets/sIdle.png", "sIdle2": "assets/sIdle2.png", "sWind": "assets/sWind.png", "sStrike": "assets/sStrike.png", "sRecover": "assets/sRecover.png", "sBlock": "assets/sBlock.png", "sHurt": "assets/sHurt.png", "sDeath": "assets/sDeath.png"};
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const W = 960, H = 540, GROUND_Y = 476, DRAW_H = 158, KING_SCALE = 0.74, BOSS_SCALE = 0.85, SKELE_SCALE = 0.66;
ctx.imageSmoothingEnabled = false;

// ---------- asset loading ----------
const IMG = {};
function loadAll(){
  const keys = Object.keys(ASSETS);
  let done = 0;
  return new Promise(res=>{
    keys.forEach(k=>{
      const im = new Image();
      im.onload = im.onerror = ()=>{ if(++done===keys.length) res(); };
      im.src = ASSETS[k]; IMG[k] = im;
    });
  });
}

// ---------- (enemies now use dedicated skeleton frames) ----------

// ---------- input ----------
const keys={left:false,right:false,jump:false,atk:false};
addEventListener('keydown',e=>{
  if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;
  if(['ArrowRight','d','D'].includes(e.key))keys.right=true;
  if(['ArrowUp','w','W',' '].includes(e.key)){keys.jump=true; e.preventDefault();}
  if(['z','Z','x','X','j','J'].includes(e.key))keys.atk=true;
});
addEventListener('keyup',e=>{
  if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;
  if(['ArrowRight','d','D'].includes(e.key))keys.right=false;
  if(['ArrowUp','w','W',' '].includes(e.key))keys.jump=false;
  if(['z','Z','x','X','j','J'].includes(e.key))keys.atk=false;
});
function bindBtn(id,prop){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault(); keys[prop]=true;};
  const off=e=>{e.preventDefault(); keys[prop]=false;};
  el.addEventListener('pointerdown',on); el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off); el.addEventListener('pointerleave',off);
}
bindBtn('bLeft','left'); bindBtn('bRight','right'); bindBtn('bJump','jump'); bindBtn('bAtk','atk');
const isTouch = matchMedia('(pointer:coarse)').matches;

// ---------- game state ----------
const GOAL = 6200;
let king, enemies, vfx, cam, particles, state='title', nextSpawn, score, shake;
let phase='march', boss=null, bannerT=0, bossReached=false, retryBoss=false;
const camBoss = GOAL - W + 240;

function reset(){
  king={x:140,y:GROUND_Y,vy:0,onGround:true,dir:1,hp:100,maxhp:100,
        st:'idle',walkPhase:0,atkT:0,atkFrame:0,atkHit:false,hurtT:0,inv:0};
  enemies=[]; vfx=[]; particles=[]; score=0; shake=0;
  cam=0; nextSpawn=620; phase='march'; boss=null; bannerT=0;
}

// ---------- helpers ----------
function spawnEnemy(x){
  enemies.push({x:x,y:GROUND_Y,hp:2,st:'walk',phase:Math.random()*8,
                cd:300+Math.random()*400, aT:0, struck:false, hurtT:0,
                blockT:0, blockCd:0, blockRolled:false, faceLeft:true, dead:false, dieT:0});
}
function addSlash(x,y,flip){ vfx.push({x,y,t:0,dur:300,flip}); }
function hitSpark(x,y){ for(let i=0;i<7;i++)
  particles.push({x,y,vx:(Math.random()-0.5)*6,vy:-Math.random()*5-1,t:0,dur:380}); }

// ---------- king (shared by both phases) ----------
function updateKing(dt){
  const k=king, speed=3.4, attacking = k.st==='attack';
  if(!attacking){
    let mv=0;
    if(keys.left)mv-=1; if(keys.right)mv+=1;
    if(mv!==0){ k.dir=mv; if(k.onGround) k.st='walk'; }
    else if(k.onGround) k.st='idle';
    let nx=k.x+mv*speed;
    if(mv>0){ for(const e of enemies){ if(!e.dead){ const d=e.x-nx;
      if(d>0&&d<66&&Math.abs(e.y-k.y)<60) nx=Math.min(nx,e.x-66); } }
      if(boss&&!boss.dead){ const d=boss.x-nx; if(d>0&&d<92) nx=Math.min(nx,boss.x-92); } }
    if(mv<0){ for(const e of enemies){ if(!e.dead){ const d=nx-e.x;
      if(d>0&&d<66&&Math.abs(e.y-k.y)<60) nx=Math.max(nx,e.x+66); } }
      if(boss&&!boss.dead){ const d=nx-boss.x; if(d>0&&d<92) nx=Math.max(nx,boss.x+92); } }
    k.x=nx;
    k.walkPhase += Math.abs(mv)*0.18;
  }
  if(k.x<40)k.x=40;
  if(keys.jump && k.onGround){ k.vy=-12.5; k.onGround=false; }
  k.vy += 0.62; k.y += k.vy;
  if(k.y>=GROUND_Y){ k.y=GROUND_Y; k.vy=0; if(!k.onGround){k.onGround=true;} }
  if(keys.atk && k.st!=='attack' && k.atkT<=0 && k.onGround){
    k.st='attack'; k.atkT=330; k.atkFrame=0; k.atkHit=false;
  }
  if(k.st==='attack'){
    k.atkT-=dt;
    const p=1-(k.atkT/330);
    k.atkFrame = p<0.34?0 : p<0.62?1 : 2;
    if(k.atkFrame>=1 && !k.atkHit){
      k.atkHit=true;
      addSlash(k.x + k.dir*70, k.y-78, k.dir<0);
      enemies.forEach(e=>{
        if(e.dead)return;
        const dx=(e.x-k.x)*k.dir;
        if(dx>0 && dx<120 && Math.abs(e.y-k.y)<60){
          if(e.st==='block' && e.blockT>0){           // shield turns the blow
            hitSpark(e.x-k.dir*26, e.y-92); shake=4; e.x += k.dir*10;
            e.blockT=Math.min(e.blockT,140);
          } else {
            e.hp--; e.hurtT=220; e.st='hurt'; e.x += k.dir*26;
            hitSpark(e.x, e.y-80); shake=6;
            if(e.hp<=0){ e.dead=true; e.dieT=620; score++; }
          }
        }
      });
      if(boss && !boss.dead && boss.vuln){
        const bdx=(boss.x-k.x)*k.dir;
        if(bdx>0 && bdx<160){ boss.hp--; boss.hurtT=170; boss.flash=120;
          hitSpark(k.x+k.dir*120, k.y-150); shake=7;
          if(boss.hp<=0){ boss.dead=true; boss.dieT=1200; boss.st='down'; } }
      }
    }
    if(k.atkT<=0){ k.st = (keys.left||keys.right)?'walk':'idle'; }
  }
  if(k.atkT>0 && k.st!=='attack') k.atkT-=dt;
  if(k.inv>0)k.inv-=dt;
}

// ---------- boss ----------
function enterBoss(){
  phase='boss'; bossReached=true;
  enemies=[]; vfx=[]; particles=[];
  king.x = camBoss+150; king.hp=king.maxhp; king.inv=0; king.st='idle'; king.atkT=0; king.vy=0;
  cam = camBoss; spawnBoss(); bannerT=2600;
}
function spawnBoss(){
  boss={x:camBoss+W-200, y:GROUND_Y-280, hp:22, maxhp:22, dir:-1, st:'enter', t:560,
        animT:0, cd:1200, vuln:false, hurtT:0, flash:0, dead:false, dieT:0,
        chargeVx:0, walkPhase:0, enterY:-280, hitDone:false, faceLeft:true};
}
function updateBoss(dt){
  const k=king, b=boss;
  if(k.x < camBoss+60) k.x=camBoss+60;
  if(k.x > camBoss+W-90) k.x=camBoss+W-90;
  if(!b) return;
  b.animT+=dt; if(b.flash>0)b.flash-=dt; b.hurtT=Math.max(0,b.hurtT-dt);
  if(b.dead){ b.dieT-=dt; b.y=GROUND_Y; if(b.dieT<=0) endGame(true); return; }
  const dist=b.x-k.x;
  if(b.st==='enter'){
    b.t-=dt; b.enterY=-280*Math.max(0,b.t/560); b.y=GROUND_Y+b.enterY;
    if(b.t<=0){ b.y=GROUND_Y; b.st='idle'; b.vuln=true; b.cd=900; shake=12; }
    return;
  }
  b.y=GROUND_Y;
  const toK = Math.sign(king.x - b.x);          // +1 king on boss's right, -1 on left
  const adist = Math.abs(king.x - b.x);
  b.faceLeft = (king.x <= b.x);
  if(b.st==='idle'){
    b.vuln=true; b.cd-=dt;
    if(adist>210) b.x += toK*1.0;
    if(b.cd<=0){ if(adist<230){ b.st='windup'; b.t=520; } else { b.st='chargeWind'; b.t=620; } }
  } else if(b.st==='windup'){
    b.vuln=true; b.t-=dt; if(b.t<=0){ b.st='swing'; b.t=200; b.hitDone=false; }
  } else if(b.st==='swing'){
    b.t-=dt;
    if(!b.hitDone){ b.hitDone=true;
      if(adist<185 && k.onGround && k.inv<=0){ k.hp-=18; k.inv=800; k.vy=-5; k.x-=toK*30; shake=10; } }
    if(b.t<=0){ b.st='recover'; b.t=440; }
  } else if(b.st==='recover'){
    b.vuln=true; b.t-=dt; if(b.t<=0){ b.st='idle'; b.cd=650+Math.random()*500; }
  } else if(b.st==='chargeWind'){
    b.vuln=true; b.t-=dt; b.x -= toK*0.5;
    if(b.t<=0){ b.st='charge'; b.vuln=false; b.chargeVx = toK*11.5; }
  } else if(b.st==='charge'){
    b.x += b.chargeVx; b.walkPhase+=0.45;
    if(Math.abs(b.x-k.x)<95){
      const airborne = k.y < GROUND_Y-55;
      if(!airborne && k.inv<=0){ k.hp-=26; k.inv=950; k.vy=-7; k.x += Math.sign(b.chargeVx)*40; shake=14;
        b.st='recover'; b.t=520; b.vuln=true; }
    }
    if(b.x<=camBoss+95 || b.x>=camBoss+W-95){
      b.x=Math.max(camBoss+95, Math.min(camBoss+W-95, b.x));
      b.st='recover'; b.t=600; b.vuln=true; shake=8;
    }
  }
}

// ---------- update ----------
function update(dt){
  updateKing(dt);
  if(phase==='march'){
    if(king.x > nextSpawn && enemies.filter(e=>!e.dead).length<4){
      spawnEnemy(king.x + W*0.65 + Math.random()*120);
      nextSpawn = king.x + 360 + Math.random()*260;
    }
    enemies.forEach(e=>{
      if(e.dead){ e.dieT-=dt; return; }
      e.hurtT=Math.max(0,e.hurtT-dt); e.cd=Math.max(0,e.cd-dt); e.blockCd=Math.max(0,e.blockCd-dt);
      e.faceLeft = (king.x <= e.x);
      const dx=king.x-e.x, dist=Math.abs(dx);

      // react to the King's swing by sometimes raising the shield
      if(king.st==='attack' && !king.atkHit){
        if(!e.blockRolled){ e.blockRolled=true;
          if(dist<150 && e.blockCd<=0 && (e.st==='walk'||e.st==='idle') && Math.random()<0.33){
            e.st='block'; e.blockT=460; e.blockCd=1700;
          }
        }
      } else { e.blockRolled=false; }

      if(e.hurtT>0){ e.st='hurt'; return; }
      if(e.st==='block'){ e.blockT-=dt; if(e.blockT<=0) e.st='walk'; return; }
      if(e.st==='windup'){ e.aT-=dt; if(e.aT<=0){ e.st='strike'; e.aT=150; e.struck=false; } return; }
      if(e.st==='strike'){ e.aT-=dt;
        if(!e.struck){ e.struck=true;
          if(dist<82 && king.inv<=0){ king.hp-=10; king.inv=650; king.vy=-3.5; king.x-=Math.sign(dx)*16; shake=7; } }
        if(e.aT<=0){ e.st='recover'; e.aT=300; } return; }
      if(e.st==='recover'){ e.aT-=dt; if(e.aT<=0){ e.st='walk'; e.cd=500+Math.random()*500; } return; }

      // walk / approach / begin attack
      if(dist>62){ e.x += Math.sign(dx)*2.0; e.phase+=0.16; e.st='walk'; }
      else if(e.cd<=0){ e.st='windup'; e.aT=340; }
      else e.st='walk';
    });
    enemies = enemies.filter(e=> !(e.dead && e.dieT<=0));
    const targetCam = Math.max(0, Math.min(camBoss, king.x - W*0.34));
    cam += (targetCam-cam)*0.12;
    if(king.x>=GOAL) enterBoss();
  } else {
    updateBoss(dt);
    cam += (camBoss-cam)*0.12;
  }
  vfx.forEach(v=>v.t+=dt); vfx=vfx.filter(v=>v.t<v.dur);
  particles.forEach(p=>{p.t+=dt; p.x+=p.vx; p.y+=p.vy; p.vy+=0.4;});
  particles=particles.filter(p=>p.t<p.dur);
  if(shake>0) shake-=0.6;
  if(bannerT>0) bannerT-=dt;
  if(king.hp<=0){ king.hp=0; endGame(false, phase==='boss'); }
}

// ---------- draw ----------
function drawSprite(img, wx, y, dir, scaleH){
  const h=scaleH||DRAW_H, s=h/img.height, w=img.width*s;
  const sx=wx-cam;
  ctx.save();
  ctx.translate(sx, y);
  if(dir<0) ctx.scale(-1,1);
  ctx.drawImage(img, -w/2, -h, w, h);
  ctx.restore();
}
function draw(){
  const sh = shake>0 ? (Math.random()-0.5)*shake : 0;
  ctx.save(); ctx.translate(sh, sh*0.4);
  // backdrop (slow parallax, looped)
  const bd=IMG.bg, bds=H/bd.height, bw=bd.width*bds;
  let off=(-cam*0.25)%bw; if(off>0)off-=bw;
  for(let x=off; x<W; x+=bw) ctx.drawImage(bd, x, 0, bw, H);
  // ground strip (1x, tiled)
  const gr=IMG.ground, gw=gr.width, gy=GROUND_Y-26;
  let goff=(-cam)%gw; if(goff>0)goff-=gw;
  for(let x=goff; x<W; x+=gw) ctx.drawImage(gr, x, gy, gw, H-gy);
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(0,GROUND_Y-2,W,H);

  // skeletons (art faces left; flip only if King slips behind them)
  enemies.forEach(e=>{
    let img;
    if(e.dead){ img=IMG.sDeath; }
    else if(e.st==='hurt'){ img=IMG.sHurt; }
    else if(e.st==='block'){ img=IMG.sBlock; }
    else if(e.st==='windup'){ img=IMG.sWind; }
    else if(e.st==='strike'){ img=IMG.sStrike; }
    else if(e.st==='recover'){ img=IMG.sRecover; }
    else { img=IMG['sWalk'+(Math.floor(e.phase)%8)]; }
    ctx.globalAlpha = e.dead ? Math.max(0, e.dieT/620) : 1;
    drawSprite(img, e.x, e.y + (e.dead?6:0), e.faceLeft?1:-1, img.height*SKELE_SCALE);
    ctx.globalAlpha=1;
  });

  // boss (faces left toward king)
  if(boss){
    const b=boss; let bimg=IMG.bIdle;
    if(b.dead) bimg=IMG.bDown;
    else if(b.hurtT>0) bimg=IMG.bHurt;
    else if(b.st==='windup') bimg=IMG.bWind;
    else if(b.st==='swing') bimg=IMG.bSwing;
    else if(b.st==='recover') bimg=IMG.bFollow;
    else if(b.st==='chargeWind') bimg=IMG.bCharge;
    else if(b.st==='charge') bimg=IMG['bWalk'+(Math.floor(b.walkPhase)%8)];
    else if(b.st==='enter') bimg=IMG.bCharge;
    else bimg = (Math.floor(b.animT/380)%2)?IMG.bIdle2:IMG.bIdle;
    ctx.globalAlpha = b.dead ? Math.max(0.15, b.dieT/1200) : 1;
    drawSprite(bimg, b.x, b.y, b.faceLeft?1:-1, bimg.height*BOSS_SCALE);
    ctx.globalAlpha=1;
    if(!b.dead && (b.st==='windup'||b.st==='chargeWind') && Math.floor(b.animT/120)%2){
      ctx.fillStyle='#ff4030'; ctx.font='30px "Press Start 2P",monospace'; ctx.textAlign='center';
      ctx.fillText('!', b.x-cam, b.y-262); ctx.textAlign='left';
    }
  }

  // king
  const k=king; let kimg;
  if(k.st==='attack') kimg = [IMG.atk0,IMG.atk1,IMG.atk2][k.atkFrame];
  else if(!k.onGround) kimg = IMG.idle;
  else if(k.st==='walk') kimg = IMG['walk'+(Math.floor(k.walkPhase)%8)];
  else kimg = IMG.idle;
  if(k.inv>0 && Math.floor(k.inv/80)%2) ctx.globalAlpha=0.5;
  drawSprite(kimg, k.x, k.y, k.dir, kimg.height*KING_SCALE);
  ctx.globalAlpha=1;

  // hit-spark particles
  particles.forEach(p=>{ ctx.globalAlpha=Math.max(0,1-p.t/p.dur);
    ctx.fillStyle='#ffd98a'; ctx.fillRect(p.x-cam-2, p.y-2, 4, 4); });
  ctx.globalAlpha=1;

  // crescent vfx
  vfx.forEach(v=>{
    const p=v.t/v.dur, sx=v.x-cam;
    ctx.save(); ctx.translate(sx, v.y); if(v.flip)ctx.scale(-1,1);
    ctx.globalAlpha = p<0.3? p/0.3 : 1-(p-0.3)/0.7;
    const rot=(-0.9 + p*1.5), sc=0.6+p*0.8;
    ctx.rotate(rot); ctx.scale(sc,sc);
    const im=IMG.slash; ctx.drawImage(im,-im.width/2,-im.height/2);
    ctx.restore();
  });
  ctx.globalAlpha=1;
  ctx.restore();

  drawHUD();
}
function drawHUD(){
  // HP
  ctx.fillStyle='rgba(8,10,16,.8)'; ctx.fillRect(14,14,250,46);
  ctx.strokeStyle='#c9a24a'; ctx.lineWidth=2; ctx.strokeRect(14,14,250,46);
  ctx.fillStyle='#0a0d12'; ctx.fillRect(22,38,234,14);
  ctx.fillStyle='#5fbf57'; ctx.fillRect(22,38,234*Math.max(0,king.hp/king.maxhp),14);
  ctx.fillStyle='#c9a24a'; ctx.font='16px "Press Start 2P",monospace';
  ctx.fillText('KING OF KOD', 24, 32);
  ctx.textAlign='right';
  ctx.fillText('FELLED  '+score, W-16, 34); ctx.textAlign='left';

  if(phase==='march'){
    const pw=W-120, px=60, py=H-20;
    ctx.fillStyle='rgba(8,10,16,.7)'; ctx.fillRect(px,py,pw,8);
    ctx.fillStyle='#c9a24a'; ctx.fillRect(px,py, pw*Math.min(1,king.x/GOAL), 8);
    ctx.font='13px "Press Start 2P",monospace'; ctx.fillStyle='#9aa7b8';
    ctx.textAlign='right'; ctx.fillText('GATE', px+pw-2, py-6); ctx.textAlign='left';
  } else if(boss){
    const bbw=W-260, bbx=130, bby=64;
    ctx.fillStyle='rgba(8,10,16,.85)'; ctx.fillRect(bbx-4,bby-22,bbw+8,30);
    ctx.strokeStyle='#7a2a2a'; ctx.lineWidth=2; ctx.strokeRect(bbx-4,bby-22,bbw+8,30);
    ctx.fillStyle='#0a0d12'; ctx.fillRect(bbx,bby-8,bbw,12);
    ctx.fillStyle='#d6443a'; ctx.fillRect(bbx,bby-8,bbw*Math.max(0,boss.hp/boss.maxhp),12);
    ctx.fillStyle='#e7c468'; ctx.font='12px "Press Start 2P",monospace'; ctx.textAlign='center';
    ctx.fillText('THE GATEKEEPER', W/2, bby-12); ctx.textAlign='left';
  }
  if(bannerT>0){
    let a=1; if(bannerT>2200)a=(2600-bannerT)/400; else if(bannerT<400)a=bannerT/400;
    ctx.globalAlpha=Math.max(0,Math.min(1,a));
    ctx.fillStyle='#000'; ctx.fillRect(0,H/2-46,W,92);
    ctx.fillStyle='#d6443a'; ctx.font='30px "Press Start 2P",monospace'; ctx.textAlign='center';
    ctx.fillText('THE GATEKEEPER', W/2, H/2+2);
    ctx.fillStyle='#9aa7b8'; ctx.font='15px "Press Start 2P",monospace';
    ctx.fillText('GUARDIAN OF THE GATE', W/2, H/2+34);
    ctx.textAlign='left'; ctx.globalAlpha=1;
  }
}

// ---------- loop ----------
let last=0;
function frame(t){
  const dt=Math.min(40, t-last||16); last=t;
  if(state==='play'){ update(dt); draw(); }
  requestAnimationFrame(frame);
}

// ---------- screens ----------
function startGame(){
  reset(); state='play';
  document.getElementById('titleScreen').classList.add('hide');
  document.getElementById('endScreen').classList.add('hide');
  if(isTouch) document.getElementById('pad').classList.remove('pad-hide');
}
function startBossRetry(){
  reset(); enterBoss(); state='play';
  document.getElementById('endScreen').classList.add('hide');
  if(isTouch) document.getElementById('pad').classList.remove('pad-hide');
}
function endGame(won, bossLoss){
  if(state!=='play')return;
  state='end';
  retryBoss = (!won && !!bossLoss);
  if(isTouch) document.getElementById('pad').classList.add('pad-hide');
  document.getElementById('endTitle').textContent = won?'THE GATE IS YOURS':'THE KING HAS FALLEN';
  document.getElementById('endTitle').style.color = won?'#c9a24a':'#d6443a';
  document.getElementById('endMsg').innerHTML = won
    ? `The Gatekeeper falls. The castle is yours.<br>Shadows felled: <b>${score}</b>.`
    : (bossLoss ? `The Gatekeeper still stands. Rally and try again.`
                : `The shadow host overwhelms you.<br>Shadows felled: <b>${score}</b>.`);
  document.getElementById('againBtn').textContent = retryBoss ? 'RETRY BOSS' : 'MARCH AGAIN';
  document.getElementById('endScreen').classList.remove('hide');
}
document.getElementById('startBtn').onclick=startGame;
document.getElementById('againBtn').onclick=()=>{ retryBoss ? startBossRetry() : startGame(); };

// ---------- boot ----------
loadAll().then(()=>{
  document.getElementById('ctrlHint').innerHTML = isTouch
    ? 'Turn your phone sideways.<br>◀ ▶ move &nbsp; ⤒ jump &nbsp; ⚔ strike'
    : '← → move &nbsp;·&nbsp; ↑ / Space jump &nbsp;·&nbsp; Z / X strike';
  if(isTouch){
    const fs=document.getElementById('fsBtn');
    fs.style.display='flex';
    fs.addEventListener('click', async ()=>{
      try{
        const el=document.documentElement;
        if(!document.fullscreenElement && el.requestFullscreen) await el.requestFullscreen();
        else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
      }catch(e){}
    });
  }
  document.getElementById('loadScreen').classList.add('hide');
  document.getElementById('titleScreen').classList.remove('hide');
  // idle preview render
  state='title';
});
requestAnimationFrame(frame);
document.getElementById('rotate').addEventListener('click', function(){ this.classList.add('gone'); });
</script>
